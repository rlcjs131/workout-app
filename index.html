<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>운동 루틴</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="application-name" content="운동 루틴">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="운동 루틴">
<meta name="mobile-web-app-capable" content="yes">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap');

  :root {
    --void: #1C2036;
    --panel: #2A2F56;
    --raised: #383E72;
    --sunken: #151830;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --ink: #F4F5FA;
    --muted: #9296C2;
    --faint: #5F6392;
    --gain: #34D399;
    --drop: #FB7185;
    --warn: #FBBF24;
    --primary: #7C6CFF;
    --on-primary: #ffffff;

    --m-chest: #FF6B5C;
    --m-back: #2DD4BF;
    --m-shoulder: #FFB020;
    --m-legs: #A78BFA;
    --m-tri: #5B9EFF;
    --m-bi: #FF7AC6;

    --ui: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
    --num: 'Archivo', 'Pretendard', system-ui, sans-serif;

    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 9px;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--void);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  .bulk-app {
    background: transparent;
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.5;
    max-width: 460px;
    margin: 0 auto;
    padding: 24px 18px calc(84px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
    box-sizing: border-box;
  }
  .bulk-app *, .bulk-app *::before, .bulk-app *::after { box-sizing: border-box; }
  .bulk-app :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

  /* ---------- 상단 ---------- */
  .bulk-app .masthead {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 22px;
  }
  .bulk-app .masthead h1 {
    font-family: var(--num);
    font-size: 21px;
    font-weight: 700;
    font-stretch: 108%;
    letter-spacing: -0.015em;
    margin: 0;
    line-height: 1.15;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0;
  }
  .bulk-app .masthead p {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--faint);
    letter-spacing: -0.01em;
  }
  .bulk-app .profile-tag {
    font-family: var(--ui);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: -0.01em;
    margin-left: 8px;
    padding: 3px 8px;
    background: var(--raised);
    border-radius: 999px;
  }
  .bulk-app .profile-tag:empty { display: none; }
  .bulk-app .masthead-actions { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
  .bulk-app .back-btn-inline {
    background: var(--raised); border: none; color: var(--ink);
    font-family: var(--ui); font-size: 12.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 8px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .bulk-app .back-btn-inline:hover { background: #454C86; }
  .bulk-app .gear-btn {
    flex-shrink: 0; width: 36px; height: 36px; padding: 9px;
    background: var(--raised); border: none; border-radius: 999px;
    color: var(--muted); cursor: pointer;
  }
  .bulk-app .gear-btn svg { width: 100%; height: 100%; display: block; }
  .bulk-app .gear-btn:hover { color: var(--ink); background: #454C86; }

  /* ---------- 하단 탭바 ---------- */
  .tab-bar, .tab-bar * { box-sizing: border-box; }
  .tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    max-width: 460px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(28, 32, 54, 0.92);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .mode-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: transparent; border: none; color: var(--faint);
    font-family: var(--ui); font-size: 10.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 7px 2px 6px; cursor: pointer;
    transition: color .15s ease;
  }
  .mode-btn svg { width: 21px; height: 21px; }
  .mode-btn[aria-selected="true"] { color: var(--primary); }

  .bulk-app .day-tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 18px; }
  .bulk-app .day-tab {
    position: relative; background: var(--panel);
    border: 1px solid var(--line); color: var(--muted);
    font-family: var(--num); font-size: 15px; font-weight: 600; font-stretch: 100%;
    padding: 11px 0; border-radius: var(--r-md); cursor: pointer;
    transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .bulk-app .day-tab[aria-selected="true"] {
    background: var(--primary); border-color: var(--primary); color: var(--on-primary);
  }
  .bulk-app .day-tab .today-dot {
    position: absolute; top: 6px; right: 6px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--gain);
  }
  .bulk-app .day-tab[aria-selected="true"] .today-dot { background: var(--on-primary); }
  .bulk-app .rest-note { font-size: 12px; color: var(--muted); margin: -8px 0 16px; }

  /* ---------- 카드 공통 ---------- */
  .bulk-app .day-panel,
  .bulk-app .settings-card,
  .bulk-app .rec-filter,
  .bulk-app .rep-summary,
  .bulk-app .rep-day,
  #principles,
  .bulk-app .rec-group {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
  }
  #principles { overflow: hidden; margin-bottom: 14px; }

  /* ---------- 요일 패널 ---------- */
  .bulk-app .day-panel { padding: 18px 16px 16px; margin-bottom: 14px; }
  .bulk-app .stamp-row {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .bulk-app .stamp { flex: 1; min-width: 0; }
  .bulk-app .in-stamp {
    background: transparent; border: none; color: var(--ink);
    font-family: var(--ui); font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
    padding: 0; width: 100%;
  }
  .bulk-app .in-stamp::placeholder { color: var(--faint); }
  .bulk-app .in-stamp:focus { outline: none; border-bottom: 1px solid var(--line-strong); }
  .bulk-app .set-total {
    font-family: var(--num); font-size: 34px; font-weight: 700; font-stretch: 112%;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
    line-height: 1; white-space: nowrap; flex-shrink: 0;
  }
  .bulk-app .set-total span {
    font-family: var(--ui); font-size: 11px; font-weight: 500; font-stretch: normal;
    color: var(--faint); margin-left: 4px; letter-spacing: 0;
  }
  .bulk-app .day-note { font-size: 11.5px; color: var(--warn); margin: 12px 0 0; line-height: 1.55; }

  /* ---------- 종목 행 ---------- */
  .bulk-app .exercise-list { list-style: none; margin: 4px 0 0; padding: 0; }
  .bulk-app .ex-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .bulk-app .ex-row:last-child { border-bottom: none; padding-bottom: 4px; }
  .bulk-app .ex-top { display: flex; align-items: center; gap: 10px; }
  .bulk-app .ex-num {
    flex-shrink: 0; width: 22px; height: 22px; background: var(--raised);
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-size: 11px; font-weight: 600; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .bulk-app .ex-fields {
    display: flex; gap: 6px; margin: 10px 0 0 32px; align-items: center; flex-wrap: wrap;
  }
  .bulk-app .field { display: flex; align-items: center; gap: 5px; }
  .bulk-app .field label { font-size: 10.5px; color: var(--faint); letter-spacing: -0.01em; }

  /* ---------- 입력 ---------- */
  .bulk-app input, .bulk-app select, .bulk-app textarea {
    background: var(--sunken); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--ui); font-size: 13px; padding: 8px 10px;
    border-radius: var(--r-sm); -webkit-appearance: none; appearance: none;
  }
  .bulk-app input:focus, .bulk-app select:focus, .bulk-app textarea:focus {
    outline: none; border-color: var(--line-strong); background: var(--raised);
  }
  .bulk-app input[type="number"] {
    font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .bulk-app select.in-name {
    flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; letter-spacing: -0.01em;
    background: transparent; border-color: transparent; padding: 4px 0;
  }
  .bulk-app select.in-name:focus { background: var(--sunken); border-color: var(--line-strong); padding: 4px 8px; }
  .bulk-app .in-sets { width: 50px; text-align: center; }
  .bulk-app .in-reps { width: 66px; text-align: center; }
  .bulk-app .in-rir { width: 56px; text-align: center; }
  .bulk-app .in-weight { width: 66px; text-align: center; }
  .bulk-app .in-done { width: 56px; text-align: center; }
  .bulk-app .in-muscle { font-size: 11.5px; padding: 7px 8px; color: var(--muted); }

  /* ---------- 기록 입력 ---------- */
  .bulk-app .log-fields {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    margin: 10px 0 0 32px; padding: 10px 0 0; border-top: 1px dashed var(--line);
  }
  .bulk-app .log-fields .field label { color: var(--muted); font-weight: 500; }
  .bulk-app .prev-hint {
    font-size: 11px; color: var(--faint); margin: 8px 0 0 32px; letter-spacing: -0.01em;
  }
  .bulk-app .prev-hint b { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bulk-app .suggest-hint { margin-top: 4px; }
  .bulk-app .suggest-hint.suggest-up { color: var(--gain); }
  .bulk-app .suggest-hint.suggest-down { color: var(--drop); }
  .bulk-app .prev-hint .up { color: var(--gain); }
  .bulk-app .prev-hint .down { color: var(--drop); }

  /* ---------- 버튼 ---------- */
  .bulk-app .btn-del, .bulk-app .btn-hist-del {
    flex-shrink: 0; background: transparent; border: 1px solid var(--line);
    color: var(--faint); min-width: 28px; height: 28px; padding: 0 7px; border-radius: 8px;
    font-family: var(--ui); font-size: 14px; line-height: 1; cursor: pointer;
  }
  .bulk-app .btn-del:hover, .bulk-app .btn-hist-del:hover {
    color: var(--drop); border-color: var(--drop);
  }
  .bulk-app .btn-hist-del { min-width: 34px; height: 30px; font-size: 13px; }
  .bulk-app .btn-hist-del.confirming, .bulk-app .btn-del.confirming {
    color: var(--void); background: var(--drop); border-color: var(--drop);
    font-size: 11px; font-weight: 700;
  }

  .bulk-app .panel-actions { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .bulk-app .btn {
    flex: 1; background: var(--raised); border: none; color: var(--ink);
    font-family: var(--ui); font-size: 12.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 11px 8px; border-radius: var(--r-md); cursor: pointer;
    transition: background .15s ease;
  }
  .bulk-app .btn:hover { background: #454C86; }
  .bulk-app .btn-cardio[aria-pressed="true"] { color: var(--gain); }
  .bulk-app .btn-log {
    flex-basis: 100%; background: var(--primary); color: var(--on-primary); font-weight: 700;
  }
  .bulk-app .btn-log:hover { background: #8D7FFF; }

  .bulk-app .cardio-tag {
    margin-top: 14px; padding-top: 12px; font-size: 11.5px; color: var(--muted);
    border-top: 1px solid var(--line);
  }
  .bulk-app .empty-note { font-size: 12.5px; color: var(--faint); padding: 18px 0 8px; line-height: 1.6; }

  .bulk-app .save-hint {
    font-size: 11px; color: var(--faint); margin: 10px 0 16px;
    text-align: center; min-height: 14px; letter-spacing: -0.01em;
  }
  .bulk-app .save-hint.on { color: var(--gain); }
  .bulk-app .save-hint.save-error { color: var(--drop); }

  /* ---------- 아코디언 ---------- */
  .bulk-app .principle { border-bottom: 1px solid var(--line); }
  .bulk-app .principle:last-of-type { border-bottom: none; }
  .bulk-app .principle summary {
    list-style: none; cursor: pointer; padding: 15px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13.5px; font-weight: 600; letter-spacing: -0.015em;
  }
  .bulk-app .principle summary::-webkit-details-marker { display: none; }
  .bulk-app .chev, .bulk-app .rec-chev {
    width: 8px; height: 8px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
    transform: rotate(45deg); transition: transform .2s ease; flex-shrink: 0; margin-top: -3px;
  }
  .bulk-app .principle[open] .chev, .bulk-app .rec-group[open] .rec-chev { transform: rotate(-135deg); margin-top: 3px; }
  .bulk-app .principle .principle-body {
    padding: 0 16px 16px; font-size: 12.5px; color: var(--muted); line-height: 1.75;
  }
  .bulk-app .principle .principle-body b { color: var(--ink); font-weight: 600; }
  .bulk-app .principle .principle-body p { margin: 0 0 10px; }
  .bulk-app .principle .principle-body ol,
  .bulk-app .principle .principle-body ul { margin: 0 0 10px; padding-left: 18px; }
  .bulk-app .principle .principle-body li { margin-bottom: 7px; }

  /* ---------- 볼륨 막대 ---------- */
  .bulk-app .bars { margin-top: 4px; }
  .bulk-app .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .bulk-app .bar-label { width: 32px; flex-shrink: 0; font-size: 12px; color: var(--ink); letter-spacing: -0.01em; }
  .bulk-app .bar-track { position: relative; flex: 1; height: 6px; background: var(--sunken); border-radius: 999px; }
  .bulk-app .bar-fill {
    position: absolute; top: 0; left: 0; bottom: 0; background: var(--ink);
    border-radius: 999px; transition: width .25s ease;
  }
  .bulk-app .bar-fill.under { background: var(--faint); }
  .bulk-app .bar-fill.over { background: var(--warn); }
  .bulk-app .bar-mark { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
  .bulk-app .bar-val {
    width: 24px; flex-shrink: 0; font-family: var(--num); font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--muted); text-align: right;
  }
  .bulk-app .bar-legend { font-size: 10.5px; color: var(--faint); margin: 10px 0 0; line-height: 1.6; }

  /* ---------- 하단 액션 ---------- */
  .bulk-app .reset-row { margin-top: 20px; display: flex; gap: 6px; }
  .bulk-app .btn-reset {
    flex: 1; background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-family: var(--ui); font-size: 11.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 10px 12px; border-radius: var(--r-md); cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .bulk-app .btn-reset:hover { color: var(--ink); border-color: var(--line-strong); }
  .bulk-app .btn-save-now { background: var(--raised); border-color: transparent; color: var(--ink); }
  .bulk-app .btn-save-now:hover { background: #454C86; border-color: transparent; }

  /* ---------- 전체 요약 ---------- */
  .bulk-app .rep-summary { padding: 16px; margin-bottom: 12px; }
  .bulk-app .rep-summary h2, .bulk-app .settings-head {
    font-size: 11.5px; font-weight: 600; color: var(--faint); margin: 0 0 14px; letter-spacing: -0.01em;
  }
  .bulk-app .rep-day { padding: 15px 16px 14px; margin-bottom: 8px; }
  .bulk-app .rep-day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 11px; }
  .bulk-app .rep-day-letter {
    font-family: var(--num); font-size: 15px; font-weight: 700; color: var(--ink);
    width: 18px; flex-shrink: 0;
  }
  .bulk-app .rep-day-title { font-size: 13px; font-weight: 600; flex: 1; letter-spacing: -0.015em; }
  .bulk-app .rep-day-total {
    font-family: var(--num); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
    white-space: nowrap; letter-spacing: -0.02em;
  }
  .bulk-app .rep-day-total span {
    font-family: var(--ui); font-size: 10px; font-weight: 500; color: var(--faint); margin-left: 3px; letter-spacing: 0;
  }
  .bulk-app .rep-ex-list { list-style: none; margin: 0; padding: 0; }
  .bulk-app .rep-ex-list li {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px;
  }
  .bulk-app .rep-ex-list li:first-child { border-top: none; }
  .bulk-app .rep-ex-name { flex: 1; min-width: 0; letter-spacing: -0.01em; }
  .bulk-app .rep-ex-spec {
    flex-shrink: 0; color: var(--faint); white-space: nowrap; font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .bulk-app .rep-ex-spec b { color: var(--muted); font-weight: 600; }
  .bulk-app .rep-note { font-size: 10.5px; color: var(--warn); margin-top: 11px; line-height: 1.55; }

  /* ---------- 운동 기록 ---------- */
  .bulk-app .rec-group { margin-bottom: 8px; overflow: hidden; }
  .bulk-app .rec-group summary {
    list-style: none; cursor: pointer; padding: 15px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .bulk-app .rec-group summary::-webkit-details-marker { display: none; }
  .bulk-app .rec-head { display: flex; align-items: baseline; gap: 9px; flex: 1; min-width: 0; }
  .bulk-app .rec-title { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
  .bulk-app .rec-count { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .bulk-app .rec-body { padding: 0 16px 14px; }
  .bulk-app .rec-ex { margin-top: 14px; }
  .bulk-app .rec-ex:first-child { margin-top: 0; }
  .bulk-app .rec-ex-name {
    font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; letter-spacing: -0.01em;
  }
  .bulk-app .rec-empty { font-size: 12px; color: var(--faint); margin: 0; }
  .bulk-app .rec-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-top: 1px solid var(--line);
  }
  .bulk-app .rec-ex-name + .rec-item { border-top: none; }
  .bulk-app .rec-when {
    width: 44px; flex-shrink: 0; font-family: var(--num); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--faint);
  }
  .bulk-app .rec-set { width: 38px; flex-shrink: 0; font-size: 10.5px; color: var(--faint); }
  .bulk-app .rec-val {
    flex: 1; font-family: var(--num); font-size: 19px; font-weight: 700; font-stretch: 105%;
    font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.025em;
  }
  .bulk-app .rec-val .unit {
    font-family: var(--ui); font-size: 11px; font-weight: 500; font-stretch: normal;
    color: var(--faint); margin-left: 4px; letter-spacing: 0;
  }
  .bulk-app .rec-val .up, .bulk-app .rec-val .down {
    font-family: var(--ui); font-size: 12px; font-weight: 700; margin-left: 6px; letter-spacing: 0;
  }
  .bulk-app .rec-val .up { color: var(--gain); }
  .bulk-app .rec-val .down { color: var(--drop); }

  /* ---------- 조회 기간 ---------- */
  .bulk-app .rec-filter { padding: 14px 16px; margin-bottom: 12px; }
  .bulk-app .rec-filter-row { display: flex; align-items: center; gap: 8px; }
  .bulk-app .rec-filter-row input[type="date"] {
    flex: 1; min-width: 0; color-scheme: dark; font-family: var(--num);
    font-variant-numeric: tabular-nums; font-size: 12.5px;
  }
  .bulk-app .rec-filter-sep { color: var(--faint); font-size: 12px; flex-shrink: 0; }
  .bulk-app .rec-filter-presets { display: flex; gap: 6px; margin-top: 8px; }
  .bulk-app .rec-preset-btn {

  /* ===== Slate / Mint Athletic Color System ===== */
  :root {
    --void: #101820;
    --panel: #192630;

    --sunken: #14212A;
    --line: rgba(177, 205, 219, 0.11);
    --line-strong: rgba(177, 205, 219, 0.24);
    --ink: #F4F0E8;
    --muted: #A8BBC5;
    --faint: #748A96;
    --gain: #75DDB9;
    --drop: #F08A7A;
    --warn: #E6B36C;
    --primary: #71D7B4;
    --on-primary: #0D2A22;
    --surface-blue: #1D2C37;
    --surface-input: #223541;
    --surface-quiet: #16232C;
    --surface-warm: #2A2924;
  }

    background: var(--void);
  }

  body {
    background: var(--void);

<body>

<script>
(function () {
  var MUSCLES = ['가슴', '등', '어깨', '하체', '삼두', '이두'];
  var MUSCLE_COLOR = {
    '가슴': 'var(--m-chest)',
    '등': 'var(--m-back)',
    '어깨': 'var(--m-shoulder)',
    '하체': 'var(--m-legs)',
    '삼두': 'var(--m-tri)',
    '이두': 'var(--m-bi)'
  };
  var MEV = 14, MRV = 22;

  function readJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return fallback;
  }
  function writeJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  }

  var PROFILES_KEY = 'bulk-routine-profiles-v1';
  var ACTIVE_PROFILE_KEY = 'bulk-routine-active-profile-v1';
  function keyFor(base, profile) { return profile === '기본' ? base : base + '::' + profile; }

  var profiles = readJSON(PROFILES_KEY, null);
  if (!profiles || !Array.isArray(profiles) || profiles.length === 0) {
    profiles = ['기본'];
    writeJSON(PROFILES_KEY, profiles);
  }
  var activeProfile = readJSON(ACTIVE_PROFILE_KEY, null);
  if (!activeProfile || profiles.indexOf(activeProfile) === -1) {
    activeProfile = profiles[0];
    writeJSON(ACTIVE_PROFILE_KEY, activeProfile);
  }

  var STORAGE_KEY, CATALOG_KEY, LOG_KEY, DRAFT_KEY;
  function applyProfileKeys() {
    STORAGE_KEY = keyFor('bulk-routine-v4', activeProfile);
    CATALOG_KEY = keyFor('bulk-routine-catalog-v2', activeProfile);
    LOG_KEY = keyFor('bulk-routine-log-v1', activeProfile);
    DRAFT_KEY = keyFor('bulk-routine-draft-v1', activeProfile);
  }
  applyProfileKeys();

  function defaults() {
    return [
      { key:'mon', letter:'월', title:'가슴 · 삼두', cardio:true, ex:[
        { n:'플랫 바벨 벤치프레스', m:'가슴', s:4, r:'6~8', rir:'1~2' },
        { n:'인클라인 덤벨 프레스', m:'가슴', s:3, r:'8~10', rir:'1~2' },
        { n:'케이블 플라이', m:'가슴', s:3, r:'12~15', rir:'1' },
        { n:'스컬크러셔 (EZ바)', m:'삼두', s:3, r:'8~10', rir:'1~2' },
        { n:'로프 푸시다운', m:'삼두', s:3, r:'12~15', rir:'0~1' }
      ]},
      { key:'tue', letter:'화', title:'등 · 이두', cardio:false, ex:[
        { n:'풀업', m:'등', s:3, r:'6~10', rir:'1~2' },
        { n:'랫풀다운', m:'등', s:3, r:'8~10', rir:'1~2' },
        { n:'시티드 로우', m:'등', s:3, r:'8~10', rir:'1~2' },
        { n:'암풀다운', m:'등', s:2, r:'12~15', rir:'0~1' },
        { n:'바벨 컬', m:'이두', s:3, r:'8~10', rir:'1' },
        { n:'인클라인 덤벨 컬', m:'이두', s:2, r:'10~12', rir:'0~1' }
      ]},
      { key:'wed', letter:'수', title:'하체', cardio:false, ex:[
        { n:'백스쿼트', m:'하체', s:4, r:'6~8', rir:'1~2' },
        { n:'루마니안 데드리프트', m:'하체', s:3, r:'8~10', rir:'1~2' },
        { n:'레그 익스텐션', m:'하체', s:3, r:'10~15', rir:'0~1' },
        { n:'레그 컬', m:'하체', s:3, r:'10~15', rir:'0~1' }
      ]},
      { key:'thu', letter:'목', title:'어깨 · 삼두', cardio:true,
        ex:[
        { n:'오버헤드 프레스', m:'어깨', s:4, r:'6~8', rir:'1~2' },
        { n:'사이드 레터럴 레이즈', m:'어깨', s:5, r:'12~20', rir:'0~1' },
        { n:'리어델트 플라이', m:'어깨', s:4, r:'12~20', rir:'0~1' },
        { n:'오버헤드 케이블 익스텐션', m:'삼두', s:2, r:'10~15', rir:'1' }
      ]},
      { key:'fri', letter:'금', title:'가슴 · 등', cardio:false, ex:[
        { n:'인클라인 벤치프레스', m:'가슴', s:3, r:'6~10', rir:'1~2' },
        { n:'케이블 크로스오버', m:'가슴', s:3, r:'12~15', rir:'0~1' },
        { n:'바벨 · 덤벨 로우', m:'등', s:3, r:'6~10', rir:'1~2' },
        { n:'시티드 케이블 로우', m:'등', s:3, r:'10~12', rir:'1' }
      ]},
      { key:'sat', letter:'토', title:'하체(간단) · 어깨 · 이두', cardio:false, ex:[
        { n:'레그프레스', m:'하체', s:4, r:'10~15', rir:'1' },
        { n:'레그 컬', m:'하체', s:3, r:'10~15', rir:'0~1' },
        { n:'사이드 레터럴 레이즈', m:'어깨', s:3, r:'12~20', rir:'0~1' },
        { n:'리어델트 플라이', m:'어깨', s:2, r:'12~20', rir:'0~1' },
        { n:'케이블 해머컬', m:'이두', s:3, r:'10~15', rir:'0~1' }
      ]}
    ];
  }

  var memoryOnly = false;
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length === 6) return finalizeDays(parsed);
      }
    } catch (e) { memoryOnly = true; }
    return finalizeDays(defaults());
  }
  function finalizeDays(result) {
    var old = '※ 금요일 인클라인 수행이 떨어지면 오버헤드 프레스 4→3세트로 조정';
    var changed = false;
    result.forEach(function (d) { if (d.note === old) { delete d.note; changed = true; } });
    if (changed) writeJSON(STORAGE_KEY, result);
    return result;
  }

  var days = load();

  // 각 항목은 { n: 이름, s: 세트, r: 반복수, rir: RIR } — 종목 관리에서 직접 등록/수정 가능
  function defaultCatalog() {
    function E(n, s, r, rir) { return { n: n, s: s, r: r, rir: rir }; }
    return {
      '가슴': [
        E('플랫 바벨 벤치프레스', 4, '6~8', '1~2'),
        E('인클라인 덤벨 프레스', 3, '8~10', '1~2'),
        E('케이블 플라이', 3, '12~15', '1'),
        E('인클라인 벤치프레스', 3, '6~10', '1~2'),
        E('케이블 크로스오버', 3, '12~15', '0~1'),
        E('디클라인 바벨 벤치프레스', 3, '8~10', '1~2'),
        E('펙덱 플라이', 3, '12~15', '0~1'),
        E('머신 체스트프레스', 3, '8~12', '1~2')
      ],
      '등': [
        E('풀업', 3, '6~10', '1~2'),
        E('랫풀다운', 3, '8~10', '1~2'),
        E('시티드 로우', 3, '8~10', '1~2'),
        E('암풀다운', 2, '12~15', '0~1'),
        E('바벨 · 덤벨 로우', 3, '6~10', '1~2'),
        E('시티드 케이블 로우', 3, '10~12', '1'),
        E('티바 로우', 3, '8~10', '1~2'),
        E('원암 덤벨 로우', 3, '8~10', '1~2')
      ],
      '어깨': [
        E('오버헤드 프레스', 4, '6~8', '1~2'),
        E('사이드 레터럴 레이즈', 4, '12~20', '0~1'),
        E('리어델트 플라이', 3, '12~20', '0~1'),
        E('덤벨 숄더프레스', 3, '8~10', '1~2'),
        E('케이블 레터럴 레이즈', 3, '12~15', '0~1'),
        E('페이스풀', 3, '12~15', '0~1'),
        E('프론트 레이즈', 2, '12~15', '0~1'),
        E('아놀드 프레스', 3, '8~10', '1~2')
      ],
      '하체': [
        E('백스쿼트', 4, '6~8', '1~2'),
        E('루마니안 데드리프트', 3, '8~10', '1~2'),
        E('레그 익스텐션', 3, '10~15', '0~1'),
        E('레그 컬', 3, '10~15', '0~1'),
        E('레그프레스', 4, '10~15', '1'),
        E('런지', 3, '8~12', '1~2'),
        E('힙 쓰러스트', 3, '8~12', '1~2'),
        E('카프레이즈', 4, '12~15', '0~1')
      ],
      '삼두': [
        E('스컬크러셔 (EZ바)', 3, '8~10', '1~2'),
        E('로프 푸시다운', 3, '12~15', '0~1'),
        E('오버헤드 케이블 익스텐션', 2, '10~15', '1'),
        E('딥스', 3, '8~10', '1~2'),
        E('클로즈그립 벤치프레스', 3, '6~10', '1~2')
      ],
      '이두': [
        E('바벨 컬', 3, '8~10', '1'),
        E('인클라인 덤벨 컬', 2, '10~12', '0~1'),
        E('케이블 해머컬', 3, '10~15', '0~1'),
        E('프리처 컬', 3, '8~10', '1'),
        E('컨센트레이션 컬', 2, '10~12', '0~1')
      ]
    };
  }

  function catalogEntry(muscle, name) {
    var arr = catalog[muscle] || [];
    for (var i = 0; i < arr.length; i++) { if (arr[i].n === name) return arr[i]; }
    return null;
  }
  function recommendFor(muscle, name) {
    var e = catalogEntry(muscle, name);
    return e ? { s: e.s, r: e.r, rir: e.rir } : { s: 3, r: '8~12', rir: '1~2' };
  }

  function parseRepRange(r) {
    var m = String(r).match(/(\d+)\s*~\s*(\d+)/);
    if (m) return { lo: parseInt(m[1], 10), hi: parseInt(m[2], 10) };
    var n = parseInt(r, 10);
    if (!isNaN(n)) return { lo: n, hi: n };
    return null;
  }

  function suggestNext(ex, name) {
    var h = historyFor(name);
    if (h.length === 0) return null;
    var last = h[h.length - 1];
    var range = parseRepRange(ex.r);
    if (!range) return null;
    var doneReps = parseInt(last.reps, 10);
    var lastW = parseFloat(last.w);
    if (isNaN(doneReps) || isNaN(lastW)) return null;
    var isCompound = range.hi <= 10;
    var bump = isCompound ? 2.5 : 1;

    if (doneReps >= range.hi) {
      return { text: '반복수 상한(' + range.hi + '회) 도달 · RIR도 목표대로였다면 다음엔 ' + (lastW + bump) + 'kg 시도', type: 'up' };
    }

    if (doneReps < range.lo) {
      var misses = 0;
      for (var i = h.length - 1; i >= 0; i--) {
        var w = parseFloat(h[i].w);
        var reps = parseInt(h[i].reps, 10);
        if (isNaN(w) || w !== lastW) break;
        if (isNaN(reps) || reps >= range.lo) break;
        misses++;
      }
      if (misses >= 2) {
        return { text: '반복수 하한(' + range.lo + '회) ' + misses + '회 연속 미달 · 무게를 ' + (lastW - bump) + 'kg로 낮춰보세요', type: 'down' };
      }
      return { text: '반복수 하한(' + range.lo + '회) 미달 · 같은 무게 ' + lastW + 'kg로 한 번 더 시도 (다음에도 미달이면 낮추세요)', type: 'hold' };
    }

    return { text: '범위 안이에요 · 같은 무게 ' + lastW + 'kg로 반복수를 ' + range.hi + '회까지 늘려보세요', type: 'hold' };
  }

  function loadCatalog() {
    var cat = readJSON(CATALOG_KEY, null);
    if (!cat) {
      cat = defaultCatalog();
      writeJSON(CATALOG_KEY, cat);
    } else {
      // 이전 버전(이름 문자열 배열)으로 저장된 데이터를 {n,s,r,rir} 객체 구조로 변환
      var seedDefaults = defaultCatalog();
      var migrated = false;
      MUSCLES.forEach(function (m) {
        if (!Array.isArray(cat[m])) { cat[m] = []; return; }
        cat[m] = cat[m].map(function (item) {
          if (typeof item === 'string') {
            migrated = true;
            var found = (seedDefaults[m] || []).filter(function (d) { return d.n === item; })[0];
            return found ? { n: item, s: found.s, r: found.r, rir: found.rir } : { n: item, s: 3, r: '8~12', rir: '1~2' };
          }
          if (item && typeof item.n === 'string') {
            if (item.s == null || item.r == null || item.rir == null) migrated = true;
            return {
              n: item.n,
              s: item.s != null ? item.s : 3,
              r: item.r || '8~12',
              rir: item.rir || '1~2'
            };
          }
          migrated = true;
          return null;
        }).filter(Boolean);
      });
      if (migrated) writeJSON(CATALOG_KEY, cat);
    }
    MUSCLES.forEach(function (m) { if (!Array.isArray(cat[m])) cat[m] = []; });
    return cat;
  }

  }

  function daysAgoStr(n) {

  }
  function lastRecord(name) {
    for (var i = logs.length - 1; i >= 0; i--) {
      var entries = logs[i].entries || [];
      for (var j = entries.length - 1; j >= 0; j--) {
        if (entries[j].n === name) return { date: logs[i].date, w: entries[j].w, reps: entries[j].reps };
      }
    }
    return null;
  }

    var out = [];
    logs.forEach(function (L) {

  function clampNumber(v, min, max, fallback) {
    var n = parseFloat(v);
    if (isNaN(n)) return fallback;
    if (min != null && n < min) n = min;

    return n;

  function makeInput(cls, value, onChange, type) {
    var el = document.createElement('input');
    el.className = cls;
    el.type = type || 'text';
    if (type === 'number') { el.min = '1'; el.max = '20'; el.step = '1'; el.inputMode = 'numeric'; }
    el.value = value;
    el.addEventListener('input', function () { onChange(el.value); });
    return el;
  }

  function makeNumberInput(cls, value, min, max, step, onChange, emptyFallback) {
    var el = document.createElement('input');
    el.className = cls;
    el.type = 'number';
    el.min = String(min);
    el.max = String(max);
    el.step = String(step);
    el.inputMode = step < 1 ? 'decimal' : 'numeric';
    el.value = value;
    el.addEventListener('input', function () { onChange(el.value, false); });
    el.addEventListener('blur', function () {
      if (el.value.trim() === '') {
        if (emptyFallback != null) { el.value = emptyFallback; onChange(String(emptyFallback), true); }
        else { onChange('', true); }
        return;
      }
      var clamped = clampNumber(el.value, min, max, emptyFallback != null ? emptyFallback : null);
      if (clamped === null) { el.value = ''; onChange('', true); return; }
      el.value = clamped;
      onChange(String(clamped), true);
    });
    return el;
  }

  function weeklyVolume() {
    var out = {};
    MUSCLES.forEach(function (m) { out[m] = 0; });
    days.forEach(function (d) {
      d.ex.forEach(function (e) {
        var s = parseInt(e.s, 10) || 0;
        if (out[e.m] !== undefined) out[e.m] += s;
      });
    });
    return out;
  }

  function numberedHistory(h) {
    var blocks = [];
    h.forEach(function (r) {
      var last = blocks[blocks.length - 1];
      if (last && last.date === r.date) last.items.push(r);
      else blocks.push({ date: r.date, items: [r] });
    });
    var out = [];
    var prevWeight = null;
    blocks.forEach(function (block) {
      block.items.forEach(function (r, idx) {
        var w = parseFloat(r.w);
        var trend = null;
        if (prevWeight !== null && !isNaN(w)) {
          if (w > prevWeight) trend = 'up';
          else if (w < prevWeight) trend = 'down';
        }
        out.push({ date: r.date, w: r.w, reps: r.reps, id: r.id, setNum: idx + 1, trend: trend });
        if (!isNaN(w)) prevWeight = w;
      });
    });
    return out;
  }

  function volumeBarsHtml(vol) {
    return MUSCLES.map(function (m) {
      var v = vol[m];
      var pct = Math.min(100, (v / MRV) * 100);
      var mevPct = (MEV / MRV) * 100;
      var cls = v < MEV ? 'under' : (v > MRV ? 'over' : '');
      var fillStyle = 'width:' + pct + '%' + (cls ? '' : ';background:' + MUSCLE_COLOR[m]);
      return '<div class="bar-row">' +
        '<span class="bar-label" style="color:' + MUSCLE_COLOR[m] + '">' + m + '</span>' +

  var recPendingDel = null;
  var recFilterFrom = '';
  var recFilterTo = '';
  function renderRecords() {
    var openStates = {};
    document.querySelectorAll('#recordsView .rec-group').forEach(function (el, i) { openStates[i] = el.open; });
    var filterActive = !!(recFilterFrom || recFilterTo);

    var html = '';
    MUSCLES.forEach(function (m, mi) {
      var entries = (catalog[m] || []).slice();
      var knownNames = entries.map(function (c) { return c.n; });

      // 새 기록에는 부위(m)를 함께 저장한다. 종목 관리 목록에서 나중에 삭제해도
      // 기록 탭에서 해당 운동 기록 자체는 계속 확인할 수 있게 한다.
      logs.forEach(function (rec) {
        (rec.entries || []).forEach(function (e) {
          if (e.m === m && knownNames.indexOf(e.n) === -1) {
            knownNames.push(e.n);
            entries.push({ n: e.n });
          }
        });
      });

      var exHtml = '';
      var trackedCount = 0;
      entries.forEach(function (c) {
        var name = c.n;
        var h = historyFor(name).filter(function (r) {
          if (recFilterFrom && r.date < recFilterFrom) return false;
          if (recFilterTo && r.date > recFilterTo) return false;
          return true;
        });
        if (h.length === 0) return;
        trackedCount += 1;
        var recent = numberedHistory(h).slice(-6);
        var rows = recent.map(function (r) {
          var confirming = recPendingDel === r.id;
          var mark = r.trend === 'up' ? ' <span class="up">↑</span>' : (r.trend === 'down' ? ' <span class="down">↓</span>' : '');
          return '<div class="rec-item">' +
            '<span class="rec-when">' + r.date.slice(5) + '</span>' +
            '<span class="rec-set">' + r.setNum + '세트</span>' +
            '<span class="rec-val">' + r.w + '<span class="unit">kg×' + r.reps + '회</span>' + mark + '</span>' +
            '<button class="btn-hist-del' + (confirming ? ' confirming' : '') + '" type="button" data-id="' + r.id +
              '" aria-label="이 기록 삭제">' + (confirming ? '삭제?' : '×') + '</button>' +
          '</div>';
        }).join('');
        exHtml += '<div class="rec-ex"><div class="rec-ex-name">' + name + '</div>' + rows + '</div>';
      });
      var hasAny = trackedCount > 0;
      var isOpen = openStates[mi] === true;
      var emptyMsg = filterActive ? '선택한 기간에는 기록이 없어요.' : '아직 저장된 기록이 없어요.';
      html += '<details class="rec-group" style="border-left:3px solid ' + MUSCLE_COLOR[m] + '"' + (isOpen ? ' open' : '') + '>' +
        '<summary>' +
          '<span class="rec-head"><span class="rec-title" style="color:' + MUSCLE_COLOR[m] + '">' + m + '</span>' +
          '<span class="rec-count">' + (hasAny ? trackedCount + '개 종목' : '기록 없음') + '</span></span>' +
          '<span class="rec-chev"></span>' +
        '</summary>' +
        '<div class="rec-body">' + (hasAny ? exHtml : '<p class="rec-empty">' + emptyMsg + '</p>') + '</div>' +
      '</details>';
    });
    recordsListEl.innerHTML = html;

    recordsListEl.querySelectorAll('.btn-hist-del').forEach(function (b) {
      var id = b.getAttribute('data-id');
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (recPendingDel !== id) { recPendingDel = id; renderRecords(); return; }
        recPendingDel = null;
        for (var i = logs.length - 1; i >= 0; i--) {
          var entries = logs[i].entries || [];
          var idx = -1;
          for (var j = 0; j < entries.length; j++) { if (entries[j].id === id) { idx = j; break; } }
          if (idx !== -1) {
            entries.splice(idx, 1);
            if (entries.length === 0) logs.splice(i, 1);
            break;
          }
        }
        writeJSON(LOG_KEY, logs);
        renderRecords();
      });
    });
  }

  var catPendingDel = null;
  function renderCatalog() {
    var openStates = {};
    document.querySelectorAll('#catalogView .rec-group').forEach(function (el, i) { openStates[i] = el.open; });

    var html = '';
    MUSCLES.forEach(function (m, mi) {
      var arr = catalog[m];
      var itemsHtml = arr.length ? arr.map(function (c, ci) {
        var token = m + '|' + c.n;
        var confirming = catPendingDel === token;
        return '<div class="cat-item">' +
          '<div class="cat-item-top">' +
            '<span class="cat-name">' + c.n + '</span>' +
            '<button class="btn-hist-del' + (confirming ? ' confirming' : '') + '" type="button" data-muscle="' + m +
              '" data-name="' + String(c.n).replace(/"/g, '&quot;') + '" aria-label="삭제">' + (confirming ? '삭제?' : '×') + '</button>' +
          '</div>' +
          '<div class="cat-item-specs">' +
            '<span class="field"><input type="number" class="in-sets cat-edit" data-muscle="' + m + '" data-idx="' + ci +
              '" data-field="s" min="1" max="20" step="1" value="' + c.s + '"><label>세트</label></span>' +
            '<span class="field"><input type="text" class="in-reps cat-edit" data-muscle="' + m + '" data-idx="' + ci +
              '" data-field="r" value="' + String(c.r).replace(/"/g, '&quot;') + '"><label>회</label></span>' +
            '<span class="field"><input type="text" class="in-rir cat-edit" data-muscle="' + m + '" data-idx="' + ci +
              '" data-field="rir" value="' + String(c.rir).replace(/"/g, '&quot;') + '"><label>RIR</label></span>' +
          '</div>' +
        '</div>';
      }).join('') : '<p class="cat-empty">등록된 종목이 없어요.</p>';

      var isOpen = openStates[mi] === true;
      html += '<details class="rec-group" style="border-left:3px solid ' + MUSCLE_COLOR[m] + '"' + (isOpen ? ' open' : '') + '>' +
        '<summary>' +
          '<span class="rec-head"><span class="rec-title" style="color:' + MUSCLE_COLOR[m] + '">' + m + '</span>' +
          '<span class="rec-count">' + arr.length + '개</span></span>' +
          '<span class="rec-chev"></span>' +
        '</summary>' +
        '<div class="rec-body">' +
          itemsHtml +
          '<div class="cat-add-row">' +
            '<input type="text" class="cat-add-name" data-muscle="' + m + '" placeholder="새 종목 이름" aria-label="' + m + ' 새 종목 이름">' +
            '<div class="cat-add-specs">' +
              '<input type="number" class="in-sets cat-add-sets" min="1" max="20" step="1" data-muscle="' + m + '" placeholder="세트" aria-label="세트">' +
              '<input type="text" class="in-reps cat-add-reps" data-muscle="' + m + '" placeholder="회" aria-label="반복수">' +
              '<input type="text" class="in-rir cat-add-rir" data-muscle="' + m + '" placeholder="RIR" aria-label="RIR">' +
              '<button class="cat-add-btn" type="button" data-muscle="' + m + '">추가</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</details>';
    });
    catalogListEl.innerHTML = html;

    catalogListEl.querySelectorAll('.cat-edit').forEach(function (input) {
      input.addEventListener('input', function () {
        var m = input.getAttribute('data-muscle');
        var idx = parseInt(input.getAttribute('data-idx'), 10);
        var field = input.getAttribute('data-field');
        var entry = catalog[m] && catalog[m][idx];
        if (!entry) return;
        entry[field] = field === 's' ? (parseInt(input.value, 10) || 0) : input.value;
        writeJSON(CATALOG_KEY, catalog);
      });
      if (input.getAttribute('data-field') === 's') {
        input.addEventListener('blur', function () {
          var m = input.getAttribute('data-muscle');
          var idx = parseInt(input.getAttribute('data-idx'), 10);
          var entry = catalog[m] && catalog[m][idx];
          if (!entry) return;
          var clamped = clampNumber(input.value, 1, 20, 3);
          input.value = clamped;
          entry.s = clamped;
          writeJSON(CATALOG_KEY, catalog);
        });
      }
    });

    catalogListEl.querySelectorAll('.cat-add-btn').forEach(function (btn) {
      var m = btn.getAttribute('data-muscle');
      var nameInput = catalogListEl.querySelector('.cat-add-name[data-muscle="' + m + '"]');
      var setsInput = catalogListEl.querySelector('.cat-add-sets[data-muscle="' + m + '"]');
      var repsInput = catalogListEl.querySelector('.cat-add-reps[data-muscle="' + m + '"]');
      var rirInput = catalogListEl.querySelector('.cat-add-rir[data-muscle="' + m + '"]');
      function doAdd() {
        var v = nameInput.value.trim();
        if (!v) return;
        if (catalog[m].some(function (c) { return c.n === v; })) { nameInput.value = ''; return; }
        var s = clampNumber(setsInput.value, 1, 20, 3);
        var r = repsInput.value.trim() || '8~12';
        var rir = rirInput.value.trim() || '1~2';
        catalog[m].push({ n: v, s: s, r: r, rir: rir });
        writeJSON(CATALOG_KEY, catalog);
        renderCatalog();
      }
      btn.addEventListener('click', function (ev) { ev.preventDefault(); doAdd(); });
      [nameInput, setsInput, repsInput, rirInput].forEach(function (el) {
        el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doAdd(); } });
      });
    });

    catalogListEl.querySelectorAll('.btn-hist-del').forEach(function (b) {
      var m = b.getAttribute('data-muscle');
      var name = b.getAttribute('data-name');
      var token = m + '|' + name;
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        if (catPendingDel !== token) { catPendingDel = token; renderCatalog(); return; }
        catPendingDel = null;
        var idx = catalog[m].findIndex(function (c) { return c.n === name; });
        if (idx !== -1) catalog[m].splice(idx, 1);
        writeJSON(CATALOG_KEY, catalog);
        renderCatalog();
      });
    });
  }

      btn.style.color = '';
      btn.style.borderColor = '';

  var profileTagEl = document.getElementById('profileTag');
  function updateProfileLabel() {
    profileTagEl.textContent = activeProfile;
  }

  var profileListEl = document.getElementById('profileList');
  var catDelPendingProfile = null;
  function renderProfileList() {
    profileListEl.innerHTML = profiles.map(function (name) {
      var isActive = name === activeProfile;
      var canDelete = !isActive && profiles.length > 1;
      var confirming = catDelPendingProfile === name;
      var delBtn = canDelete
        ? '<button class="btn-hist-del' + (confirming ? ' confirming' : '') + '" type="button" data-name="' +
          String(name).replace(/"/g, '&quot;') + '" aria-label="프로필 삭제">' + (confirming ? '삭제?' : '×') + '</button>'
        : '';
      return '<div class="profile-row">' +
        '<button class="profile-select" type="button" data-name="' + String(name).replace(/"/g, '&quot;') +
          '" aria-pressed="' + isActive + '">' + name +
          (isActive ? '<span class="current-tag">사용중</span>' : '') +
        '</button>' +
        delBtn +
      '</div>';
    }).join('');

    profileListEl.querySelectorAll('.profile-select').forEach(function (b) {
      b.addEventListener('click', function () {
        var name = b.getAttribute('data-name');
        if (name === activeProfile) return;
        switchProfile(name);
        renderProfileList();
      });
    });
    profileListEl.querySelectorAll('.btn-hist-del').forEach(function (b) {
      var name = b.getAttribute('data-name');
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        if (catDelPendingProfile !== name) { catDelPendingProfile = name; renderProfileList(); return; }
        catDelPendingProfile = null;
        var idx = profiles.indexOf(name);
        if (idx !== -1) profiles.splice(idx, 1);
        writeJSON(PROFILES_KEY, profiles);
        [
          keyFor('bulk-routine-v4', name),
          keyFor('bulk-routine-catalog-v2', name),
          keyFor('bulk-routine-log-v1', name),
          keyFor('bulk-routine-draft-v1', name)
        ].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
        renderProfileList();
      });
    });
  }

  function switchProfile(name) {
    activeProfile = name;
    writeJSON(ACTIVE_PROFILE_KEY, activeProfile);
    applyProfileKeys();
    days = load();
    catalog = loadCatalog();
    logs = loadLogs();
    draft = readJSON(DRAFT_KEY, {});
    recFilterFrom = '';
    recFilterTo = '';
    var fromInput = document.getElementById('recFilterFrom');
    var toInput = document.getElementById('recFilterTo');
    if (fromInput) fromInput.value = '';
    if (toInput) toInput.value = '';
    activeIndex = todayIndex !== null ? todayIndex : 0;
    updateProfileLabel();
    if (mode === 'catalog') renderCatalog();
    else if (mode === 'records') renderRecords();
    else if (mode === 'report') renderReport();
    else { renderTabs(); renderPanel(); renderPrinciples(); }
  }

  var settingsViewEl = document.getElementById('settingsView');
  var mainViewsEl = document.getElementById('mainViews');
  var backBtnInlineEl = document.getElementById('btnSettingsBack');
  document.getElementById('btnSettings').addEventListener('click', function () {
    mainViewsEl.hidden = true;
    settingsViewEl.hidden = false;
    backBtnInlineEl.hidden = false;
    renderProfileList();
  });
  backBtnInlineEl.addEventListener('click', function () {
    settingsViewEl.hidden = true;
    mainViewsEl.hidden = false;
    backBtnInlineEl.hidden = true;
  });

  document.getElementById('btnAddProfile').addEventListener('click', function () {
    var input = document.getElementById('newProfileName');
    var v = input.value.trim();
    if (!v || profiles.indexOf(v) !== -1) return;
    profiles.push(v);
    writeJSON(PROFILES_KEY, profiles);
    input.value = '';
    switchProfile(v);
    renderProfileList();
  });
  document.getElementById('newProfileName').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); document.getElementById('btnAddProfile').click(); }
  });

  function collectAllData() {
    var data = {};
    profiles.forEach(function (p) {
      data[p] = {
        days: readJSON(keyFor('bulk-routine-v4', p), null),
        catalog: readJSON(keyFor('bulk-routine-catalog-v2', p), null),
        logs: readJSON(keyFor('bulk-routine-log-v1', p), null),
        draft: readJSON(keyFor('bulk-routine-draft-v1', p), null)
      };
    });
    return {
      version: 1,
      exportedAt: new Date().toISOString(),
      profiles: profiles,
      activeProfile: activeProfile,
      data: data
    };
  }

  document.getElementById('btnBackupDownload').addEventListener('click', function () {
    var json = JSON.stringify(collectAllData(), null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '운동루틴-백업-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  var backupTextWrapEl = document.getElementById('backupTextWrap');
  document.getElementById('btnBackupShowText').addEventListener('click', function () {
    backupTextWrapEl.hidden = !backupTextWrapEl.hidden;
    if (!backupTextWrapEl.hidden) {
      document.getElementById('backupText').value = JSON.stringify(collectAllData(), null, 2);
    }
  });

  document.getElementById('btnBackupCopy').addEventListener('click', function (ev) {
    var ta = document.getElementById('backupText');
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    var btn = ev.currentTarget;
    var original = btn.textContent;
    btn.textContent = ok ? '복사됨' : '복사 실패 · 직접 선택해 복사하세요';
    setTimeout(function () { btn.textContent = original; }, 1500);
  });

  document.getElementById('btnRestore').addEventListener('click', function () {
    var hint = document.getElementById('restoreHint');
    var raw = document.getElementById('restoreText').value.trim();
    if (!raw) {
      hint.textContent = '백업 텍스트를 먼저 붙여넣어주세요';
      hint.className = 'save-hint';
      return;
    }
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) {
      hint.textContent = '올바른 백업 텍스트가 아니에요';
      hint.className = 'save-hint';
      return;
    }
    if (!parsed || typeof parsed !== 'object' || !parsed.data || !Array.isArray(parsed.profiles) || parsed.profiles.length === 0) {
      hint.textContent = '올바른 백업 텍스트가 아니에요';
      hint.className = 'save-hint';
      return;
    }

    parsed.profiles.forEach(function (p) {
      var pd = parsed.data[p] || {};
      if (pd.days) writeJSON(keyFor('bulk-routine-v4', p), pd.days);
      if (pd.catalog) writeJSON(keyFor('bulk-routine-catalog-v2', p), pd.catalog);
      if (pd.logs) writeJSON(keyFor('bulk-routine-log-v1', p), pd.logs);
      if (pd.draft) writeJSON(keyFor('bulk-routine-draft-v1', p), pd.draft);
    });
    writeJSON(PROFILES_KEY, parsed.profiles);
    var newActive = (parsed.activeProfile && parsed.profiles.indexOf(parsed.activeProfile) !== -1)
      ? parsed.activeProfile : parsed.profiles[0];
    writeJSON(ACTIVE_PROFILE_KEY, newActive);

    profiles = parsed.profiles;
    activeProfile = newActive;
    applyProfileKeys();
    days = load();
    catalog = loadCatalog();
    logs = loadLogs();
    draft = readJSON(DRAFT_KEY, {});
    activeIndex = todayIndex !== null ? todayIndex : 0;

    updateProfileLabel();
    renderProfileList();
    renderTabs();
    renderPanel();
    renderPrinciples();

    hint.textContent = '복원 완료';
    hint.className = 'save-hint on';
    document.getElementById('restoreText').value = '';
  });

  (function () {
    var d = new Date();
    var wk = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById('mastheadSub').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + wk[d.getDay()] + ')';
  })();

  updateProfileLabel();

  renderModeToggle();
  renderTabs();
  renderPanel();
  renderPrinciples();

  if (memoryOnly) {
    var h = document.getElementById('saveHint');
    h.textContent = '이 브라우저에서는 저장이 안 돼요 (창을 닫으면 초기화)';
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
