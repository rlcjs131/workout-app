<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>운동 루틴 · Light</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap');

  :root {
    --void: #1C2036;
    --panel: #2A2F56;
    --raised: #383E72;
    --sunken: #151830;
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --ink: #F4F5FA;
    --muted: #9296C2;
    --faint: #5F6392;
    --gain: #34D399;
    --drop: #FB7185;
    --warn: #FBBF24;
    --primary: #7C6CFF;
    --on-primary: #ffffff;

    --m-chest: #FF6B5C;
    --m-back: #2DD4BF;
    --m-shoulder: #FFB020;
    --m-legs: #A78BFA;
    --m-tri: #5B9EFF;
    --m-bi: #FF7AC6;

    --ui: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
    --num: 'Archivo', 'Pretendard', system-ui, sans-serif;

    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 9px;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--void);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  .bulk-app {
    background: transparent;
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    line-height: 1.5;
    max-width: 460px;
    margin: 0 auto;
    padding: 24px 18px calc(84px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
    box-sizing: border-box;
  }
  .bulk-app *, .bulk-app *::before, .bulk-app *::after { box-sizing: border-box; }
  .bulk-app :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

  /* ---------- 상단 ---------- */
  .bulk-app .masthead {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 22px;
  }
  .bulk-app .masthead h1 {
    font-family: var(--num);
    font-size: 21px;
    font-weight: 700;
    font-stretch: 108%;
    letter-spacing: -0.015em;
    margin: 0;
    line-height: 1.15;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0;
  }
  .bulk-app .masthead p {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--faint);
    letter-spacing: -0.01em;
  }
  .bulk-app .profile-tag {
    font-family: var(--ui);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: -0.01em;
    margin-left: 8px;
    padding: 3px 8px;
    background: var(--raised);
    border-radius: 999px;
  }
  .bulk-app .profile-tag:empty { display: none; }
  .bulk-app .masthead-actions { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
  .bulk-app .back-btn-inline {
    background: var(--raised); border: none; color: var(--ink);
    font-family: var(--ui); font-size: 12.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 8px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .bulk-app .back-btn-inline:hover { background: #454C86; }
  .bulk-app .gear-btn {
    flex-shrink: 0; width: 36px; height: 36px; padding: 9px;
    background: var(--raised); border: none; border-radius: 999px;
    color: var(--muted); cursor: pointer;
  }
  .bulk-app .gear-btn svg { width: 100%; height: 100%; display: block; }
  .bulk-app .gear-btn:hover { color: var(--ink); background: #454C86; }

  /* ---------- 하단 탭바 ---------- */
  .tab-bar, .tab-bar * { box-sizing: border-box; }
  .tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    max-width: 460px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(28, 32, 54, 0.92);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .mode-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: transparent; border: none; color: var(--faint);
    font-family: var(--ui); font-size: 10.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 7px 2px 6px; cursor: pointer;
    transition: color .15s ease;
  }
  .mode-btn svg { width: 21px; height: 21px; }
  .mode-btn[aria-selected="true"] { color: var(--primary); }

  .bulk-app .day-tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 18px; }
  .bulk-app .day-tab {
    position: relative; background: var(--panel);
    border: 1px solid var(--line); color: var(--muted);
    font-family: var(--num); font-size: 15px; font-weight: 600; font-stretch: 100%;
    padding: 11px 0; border-radius: var(--r-md); cursor: pointer;
    transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .bulk-app .day-tab[aria-selected="true"] {
    background: var(--primary); border-color: var(--primary); color: var(--on-primary);
  }
  .bulk-app .day-tab .today-dot {
    position: absolute; top: 6px; right: 6px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--gain);
  }
  .bulk-app .day-tab[aria-selected="true"] .today-dot { background: var(--on-primary); }
  .bulk-app .rest-note { font-size: 12px; color: var(--muted); margin: -8px 0 16px; }

  /* ---------- 카드 공통 ---------- */
  .bulk-app .day-panel,
  .bulk-app .settings-card,
  .bulk-app .rec-filter,
  .bulk-app .rep-summary,
  .bulk-app .rep-day,
  #principles,
  .bulk-app .rec-group {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
  }
  #principles { overflow: hidden; margin-bottom: 14px; }

  /* ---------- 요일 패널 ---------- */
  .bulk-app .day-panel { padding: 18px 16px 16px; margin-bottom: 14px; }
  .bulk-app .stamp-row {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .bulk-app .stamp { flex: 1; min-width: 0; }
  .bulk-app .in-stamp {
    background: transparent; border: none; color: var(--ink);
    font-family: var(--ui); font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
    padding: 0; width: 100%;
  }
  .bulk-app .in-stamp::placeholder { color: var(--faint); }
  .bulk-app .in-stamp:focus { outline: none; border-bottom: 1px solid var(--line-strong); }
  .bulk-app .set-total {
    font-family: var(--num); font-size: 34px; font-weight: 700; font-stretch: 112%;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
    line-height: 1; white-space: nowrap; flex-shrink: 0;
  }
  .bulk-app .set-total span {
    font-family: var(--ui); font-size: 11px; font-weight: 500; font-stretch: normal;
    color: var(--faint); margin-left: 4px; letter-spacing: 0;
  }
  .bulk-app .day-note { font-size: 11.5px; color: var(--warn); margin: 12px 0 0; line-height: 1.55; }

  /* ---------- 종목 행 ---------- */
  .bulk-app .exercise-list { list-style: none; margin: 4px 0 0; padding: 0; }
  .bulk-app .ex-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .bulk-app .ex-row:last-child { border-bottom: none; padding-bottom: 4px; }
  .bulk-app .ex-top { display: flex; align-items: center; gap: 10px; }
  .bulk-app .ex-num {
    flex-shrink: 0; width: 22px; height: 22px; background: var(--raised);
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-size: 11px; font-weight: 600; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .bulk-app .ex-fields {
    display: flex; gap: 6px; margin: 10px 0 0 32px; align-items: center; flex-wrap: wrap;
  }
  .bulk-app .field { display: flex; align-items: center; gap: 5px; }
  .bulk-app .field label { font-size: 10.5px; color: var(--faint); letter-spacing: -0.01em; }

  /* ---------- 입력 ---------- */
  .bulk-app input, .bulk-app select, .bulk-app textarea {
    background: var(--sunken); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--ui); font-size: 13px; padding: 8px 10px;
    border-radius: var(--r-sm); -webkit-appearance: none; appearance: none;
  }
  .bulk-app input:focus, .bulk-app select:focus, .bulk-app textarea:focus {
    outline: none; border-color: var(--line-strong); background: var(--raised);
  }
  .bulk-app input[type="number"] {
    font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .bulk-app select.in-name {
    flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; letter-spacing: -0.01em;
    background: transparent; border-color: transparent; padding: 4px 0;
  }
  .bulk-app select.in-name:focus { background: var(--sunken); border-color: var(--line-strong); padding: 4px 8px; }
  .bulk-app .in-sets { width: 50px; text-align: center; }
  .bulk-app .in-reps { width: 66px; text-align: center; }
  .bulk-app .in-rir { width: 56px; text-align: center; }
  .bulk-app .in-weight { width: 66px; text-align: center; }
  .bulk-app .in-done { width: 56px; text-align: center; }
  .bulk-app .in-muscle { font-size: 11.5px; padding: 7px 8px; color: var(--muted); }

  /* ---------- 기록 입력 ---------- */
  .bulk-app .log-fields {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    margin: 10px 0 0 32px; padding: 10px 0 0; border-top: 1px dashed var(--line);
  }
  .bulk-app .log-fields .field label { color: var(--muted); font-weight: 500; }
  .bulk-app .prev-hint {
    font-size: 11px; color: var(--faint); margin: 8px 0 0 32px; letter-spacing: -0.01em;
  }
  .bulk-app .prev-hint b { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bulk-app .suggest-hint { margin-top: 4px; }
  .bulk-app .suggest-hint.suggest-up { color: var(--gain); }
  .bulk-app .suggest-hint.suggest-down { color: var(--drop); }
  .bulk-app .prev-hint .up { color: var(--gain); }
  .bulk-app .prev-hint .down { color: var(--drop); }

  /* ---------- 버튼 ---------- */
  .bulk-app .btn-del, .bulk-app .btn-hist-del {
    flex-shrink: 0; background: transparent; border: 1px solid var(--line);
    color: var(--faint); min-width: 28px; height: 28px; padding: 0 7px; border-radius: 8px;
    font-family: var(--ui); font-size: 14px; line-height: 1; cursor: pointer;
  }
  .bulk-app .btn-del:hover, .bulk-app .btn-hist-del:hover {
    color: var(--drop); border-color: var(--drop);
  }
  .bulk-app .btn-hist-del { min-width: 34px; height: 30px; font-size: 13px; }
  .bulk-app .btn-hist-del.confirming, .bulk-app .btn-del.confirming {
    color: var(--void); background: var(--drop); border-color: var(--drop);
    font-size: 11px; font-weight: 700;
  }

  .bulk-app .panel-actions { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .bulk-app .btn {
    flex: 1; background: var(--raised); border: none; color: var(--ink);
    font-family: var(--ui); font-size: 12.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 11px 8px; border-radius: var(--r-md); cursor: pointer;
    transition: background .15s ease;
  }
  .bulk-app .btn:hover { background: #454C86; }
  .bulk-app .btn-cardio[aria-pressed="true"] { color: var(--gain); }
  .bulk-app .btn-log {
    flex-basis: 100%; background: var(--primary); color: var(--on-primary); font-weight: 700;
  }
  .bulk-app .btn-log:hover { background: #8D7FFF; }

  .bulk-app .cardio-tag {
    margin-top: 14px; padding-top: 12px; font-size: 11.5px; color: var(--muted);
    border-top: 1px solid var(--line);
  }
  .bulk-app .empty-note { font-size: 12.5px; color: var(--faint); padding: 18px 0 8px; line-height: 1.6; }

  .bulk-app .save-hint {
    font-size: 11px; color: var(--faint); margin: 10px 0 16px;
    text-align: center; min-height: 14px; letter-spacing: -0.01em;
  }
  .bulk-app .save-hint.on { color: var(--gain); }
  .bulk-app .save-hint.save-error { color: var(--drop); }

  /* ---------- 아코디언 ---------- */
  .bulk-app .principle { border-bottom: 1px solid var(--line); }
  .bulk-app .principle:last-of-type { border-bottom: none; }
  .bulk-app .principle summary {
    list-style: none; cursor: pointer; padding: 15px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13.5px; font-weight: 600; letter-spacing: -0.015em;
  }
  .bulk-app .principle summary::-webkit-details-marker { display: none; }
  .bulk-app .chev, .bulk-app .rec-chev {
    width: 8px; height: 8px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
    transform: rotate(45deg); transition: transform .2s ease; flex-shrink: 0; margin-top: -3px;
  }
  .bulk-app .principle[open] .chev, .bulk-app .rec-group[open] .rec-chev { transform: rotate(-135deg); margin-top: 3px; }
  .bulk-app .principle .principle-body {
    padding: 0 16px 16px; font-size: 12.5px; color: var(--muted); line-height: 1.75;
  }
  .bulk-app .principle .principle-body b { color: var(--ink); font-weight: 600; }
  .bulk-app .principle .principle-body p { margin: 0 0 10px; }
  .bulk-app .principle .principle-body ol,
  .bulk-app .principle .principle-body ul { margin: 0 0 10px; padding-left: 18px; }
  .bulk-app .principle .principle-body li { margin-bottom: 7px; }

  /* ---------- 볼륨 막대 ---------- */
  .bulk-app .bars { margin-top: 4px; }
  .bulk-app .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .bulk-app .bar-label { width: 32px; flex-shrink: 0; font-size: 12px; color: var(--ink); letter-spacing: -0.01em; }
  .bulk-app .bar-track { position: relative; flex: 1; height: 6px; background: var(--sunken); border-radius: 999px; }
  .bulk-app .bar-fill {
    position: absolute; top: 0; left: 0; bottom: 0; background: var(--ink);
    border-radius: 999px; transition: width .25s ease;
  }
  .bulk-app .bar-fill.under { background: var(--faint); }
  .bulk-app .bar-fill.over { background: var(--warn); }
  .bulk-app .bar-mark { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
  .bulk-app .bar-val {
    width: 24px; flex-shrink: 0; font-family: var(--num); font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--muted); text-align: right;
  }
  .bulk-app .bar-legend { font-size: 10.5px; color: var(--faint); margin: 10px 0 0; line-height: 1.6; }

  /* ---------- 하단 액션 ---------- */
  .bulk-app .reset-row { margin-top: 20px; display: flex; gap: 6px; }
  .bulk-app .btn-reset {
    flex: 1; background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-family: var(--ui); font-size: 11.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 10px 12px; border-radius: var(--r-md); cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .bulk-app .btn-reset:hover { color: var(--ink); border-color: var(--line-strong); }
  .bulk-app .btn-save-now { background: var(--raised); border-color: transparent; color: var(--ink); }
  .bulk-app .btn-save-now:hover { background: #454C86; border-color: transparent; }

  /* ---------- 전체 요약 ---------- */
  .bulk-app .rep-summary { padding: 16px; margin-bottom: 12px; }
  .bulk-app .rep-summary h2, .bulk-app .settings-head {
    font-size: 11.5px; font-weight: 600; color: var(--faint); margin: 0 0 14px; letter-spacing: -0.01em;
  }
  .bulk-app .rep-day { padding: 15px 16px 14px; margin-bottom: 8px; }
  .bulk-app .rep-day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 11px; }
  .bulk-app .rep-day-letter {
    font-family: var(--num); font-size: 15px; font-weight: 700; color: var(--ink);
    width: 18px; flex-shrink: 0;
  }
  .bulk-app .rep-day-title { font-size: 13px; font-weight: 600; flex: 1; letter-spacing: -0.015em; }
  .bulk-app .rep-day-total {
    font-family: var(--num); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
    white-space: nowrap; letter-spacing: -0.02em;
  }
  .bulk-app .rep-day-total span {
    font-family: var(--ui); font-size: 10px; font-weight: 500; color: var(--faint); margin-left: 3px; letter-spacing: 0;
  }
  .bulk-app .rep-ex-list { list-style: none; margin: 0; padding: 0; }
  .bulk-app .rep-ex-list li {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px;
  }
  .bulk-app .rep-ex-list li:first-child { border-top: none; }
  .bulk-app .rep-ex-name { flex: 1; min-width: 0; letter-spacing: -0.01em; }
  .bulk-app .rep-ex-spec {
    flex-shrink: 0; color: var(--faint); white-space: nowrap; font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .bulk-app .rep-ex-spec b { color: var(--muted); font-weight: 600; }
  .bulk-app .rep-note { font-size: 10.5px; color: var(--warn); margin-top: 11px; line-height: 1.55; }

  /* ---------- 운동 기록 ---------- */
  .bulk-app .rec-group { margin-bottom: 8px; overflow: hidden; }
  .bulk-app .rec-group summary {
    list-style: none; cursor: pointer; padding: 15px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .bulk-app .rec-group summary::-webkit-details-marker { display: none; }
  .bulk-app .rec-head { display: flex; align-items: baseline; gap: 9px; flex: 1; min-width: 0; }
  .bulk-app .rec-title { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
  .bulk-app .rec-count { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .bulk-app .rec-body { padding: 0 16px 14px; }
  .bulk-app .rec-ex { margin-top: 14px; }
  .bulk-app .rec-ex:first-child { margin-top: 0; }
  .bulk-app .rec-ex-name {
    font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; letter-spacing: -0.01em;
  }
  .bulk-app .rec-empty { font-size: 12px; color: var(--faint); margin: 0; }
  .bulk-app .rec-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-top: 1px solid var(--line);
  }
  .bulk-app .rec-ex-name + .rec-item { border-top: none; }
  .bulk-app .rec-when {
    width: 44px; flex-shrink: 0; font-family: var(--num); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--faint);
  }
  .bulk-app .rec-set { width: 38px; flex-shrink: 0; font-size: 10.5px; color: var(--faint); }
  .bulk-app .rec-val {
    flex: 1; font-family: var(--num); font-size: 19px; font-weight: 700; font-stretch: 105%;
    font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.025em;
  }
  .bulk-app .rec-val .unit {
    font-family: var(--ui); font-size: 11px; font-weight: 500; font-stretch: normal;
    color: var(--faint); margin-left: 4px; letter-spacing: 0;
  }
  .bulk-app .rec-val .up, .bulk-app .rec-val .down {
    font-family: var(--ui); font-size: 12px; font-weight: 700; margin-left: 6px; letter-spacing: 0;
  }
  .bulk-app .rec-val .up { color: var(--gain); }
  .bulk-app .rec-val .down { color: var(--drop); }

  /* ---------- 조회 기간 ---------- */
  .bulk-app .rec-filter { padding: 14px 16px; margin-bottom: 12px; }
  .bulk-app .rec-filter-row { display: flex; align-items: center; gap: 8px; }
  .bulk-app .rec-filter-row input[type="date"] {
    flex: 1; min-width: 0; color-scheme: dark; font-family: var(--num);
    font-variant-numeric: tabular-nums; font-size: 12.5px;
  }
  .bulk-app .rec-filter-sep { color: var(--faint); font-size: 12px; flex-shrink: 0; }
  .bulk-app .rec-filter-presets { display: flex; gap: 6px; margin-top: 8px; }
  .bulk-app .rec-preset-btn {
    flex: 1; background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-family: var(--ui); font-size: 11.5px; font-weight: 600; letter-spacing: -0.01em;
    padding: 8px 4px; border-radius: var(--r-sm); cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .bulk-app .rec-preset-btn:hover { color: var(--ink); border-color: var(--line-strong); }

  .bulk-app .cat-add-row {

  .bulk-app .cat-add-specs input { min-width: 0; }
  .bulk-app .cat-add-btn {

    font-family: var(--ui); font-size: 12.5px; font-weight: 600;
    padding: 0 12px; border-radius: var(--r-sm); cursor: pointer;
  }

  /* ---------- 설정 ---------- */
  .bulk-app .settings-view { padding-top: 2px; }
  .bulk-app .settings-head { margin-bottom: 10px; }
  .bulk-app .settings-card { padding: 16px; margin-bottom: 22px; }
  .bulk-app .profile-row {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 0; border-top: 1px solid var(--line);
  }
  .bulk-app .profile-row:first-of-type { border-top: none; padding-top: 0; }
  .bulk-app .profile-select {
    flex: 1; min-width: 0; text-align: left; background: transparent; border: none;
    color: var(--muted); font-family: var(--ui); font-size: 13.5px; font-weight: 600;
    padding: 0; cursor: pointer; letter-spacing: -0.01em;
  }
  .bulk-app .profile-select[aria-pressed="true"] { color: var(--ink); }
  .bulk-app .profile-select .current-tag {
    font-size: 10px; font-weight: 700; color: var(--void); background: var(--gain);
    padding: 3px 7px; border-radius: 999px; margin-left: 8px; letter-spacing: 0;
  }
  .bulk-app .profile-add-row {
    display: flex; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .bulk-app .profile-add-row input { flex: 1; min-width: 0; }
  .bulk-app .profile-add-row button {
    flex-shrink: 0; background: var(--raised); border: none; color: var(--ink);
    font-family: var(--ui); font-size: 12.5px; font-weight: 600;
    padding: 0 16px; border-radius: var(--r-sm); cursor: pointer;
  }
  .bulk-app .profile-add-row button:hover { background: #454C86; }

  .bulk-app .backup-note { font-size: 11.5px; color: var(--muted); margin: 0 0 14px; line-height: 1.7; }
  .bulk-app .backup-warn b { color: var(--drop); font-weight: 600; }
  .bulk-app .backup-actions { display: flex; gap: 6px; }
  .bulk-app .backup-textarea {
    width: 100%; display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px; line-height: 1.6; margin-bottom: 8px; resize: vertical;
  }
  .bulk-app #backupTextWrap { margin-top: 12px; }

  @media (max-width: 360px) {
    .mode-btn { font-size: 9.5px; }
    .mode-btn svg { width: 19px; height: 19px; }

  }

  @media (prefers-reduced-motion: reduce) {
    .bulk-app *, .bulk-app *::before, .bulk-app *::after {
      transition: none !important; animation: none !important;
    }
  }



/* Unified training interface */
:root {
 --void:#f5f6fa; --panel:#ffffff; --raised:#edf0f6; --sunken:#f7f8fc;
 --line:#e3e7ef; --line-strong:#aebbd4; --ink:#19233b; --muted:#58657b; --faint:#69758a;
 --primary:#315bea; --on-primary:#ffffff; --gain:#137454; --drop:#c43f57; --warn:#926016;
 --r-lg:24px; --r-md:14px; --r-sm:10px;
 --m-chest:#be5841; --m-back:#187f78; --m-shoulder:#926016; --m-legs:#7956b4; --m-tri:#315bea; --m-bi:#ad467c;
}
html,body {background:var(--void);color-scheme:light;}
body {background:radial-gradient(ellipse at 85% 0%,#e7ecff 0%,transparent 45%),var(--void);background-attachment:fixed;}
.bulk-app {max-width:760px;padding:32px 24px calc(126px + env(safe-area-inset-bottom));font-size:16px;}
.bulk-app .masthead {margin:0 0 28px;padding:0 2px;}
.bulk-app .masthead h1 {font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.3;}
.bulk-app .masthead p {font-size:14px;color:var(--muted);margin-top:8px;}
.bulk-app .profile-tag {font-size:12px;padding:5px 10px;color:var(--primary);background:#e7ecff;}
.bulk-app .gear-btn {width:46px;height:46px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--ink);}
.bulk-app .back-btn-inline {min-height:44px;font-size:14px;}
.bulk-app .day-tabs {gap:8px;background:transparent;margin-bottom:20px;}
.bulk-app .day-tab {background:var(--panel);border:1px solid var(--line);font-family:var(--ui);font-size:16px;padding:16px 0;border-radius:16px;color:var(--muted);}
.bulk-app .day-tab[aria-selected=true] {background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 6px 20px #315bea18;}
.bulk-app .day-tab .today-dot {background:var(--primary);}
.bulk-app .day-tab[aria-selected=true] .today-dot {background:var(--on-primary);}
.bulk-app .day-panel {background:transparent;border:0;padding:0;margin:0 0 24px;}
.bulk-app .stamp-row {background:linear-gradient(115deg,#315bea,#5278f1);border:1px solid #315bea;border-radius:22px;padding:23px 24px;margin-bottom:20px;align-items:center;}
.bulk-app .stamp::before {content:'WORKOUT PLAN';display:block;color:#dfe6ff;font:600 12px var(--ui);letter-spacing:.14em;margin-bottom:8px;}
.bulk-app .in-stamp {font-size:23px;font-weight:750;background:transparent!important;border:0;padding:0;}
.bulk-app .set-total {font-size:44px;color:var(--primary);letter-spacing:-.04em;}
.bulk-app .set-total span {display:block;text-align:right;font-size:12px;margin:6px 0 0;color:#e4e9ff;}
.bulk-app .exercise-list {display:grid;gap:12px;margin:0;}
.bulk-app .ex-row,.bulk-app .ex-row:last-child {padding:20px!important;background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:20px;box-shadow:0 4px 14px #0000000b;}
.bulk-app .ex-top {gap:12px;}
.bulk-app .ex-num {width:32px;height:32px;border-radius:10px;font-size:14px;color:var(--primary);background:#e7ecff;}
.bulk-app select.in-name {font-size:17px;font-weight:700;padding:5px 0;}
.bulk-app .btn-del,.bulk-app .btn-hist-del {min-width:36px;height:36px;border-radius:11px;font-size:18px;}
.bulk-app .ex-fields {margin:17px 0 0;gap:10px;}
.bulk-app .field {gap:6px;}
.bulk-app .field label {font-size:12px;color:var(--muted);}
.bulk-app input,.bulk-app select,.bulk-app textarea {font-size:16px;min-height:42px;padding:9px 10px;border-color:var(--line);}
.bulk-app input:focus,.bulk-app select:focus,.bulk-app textarea:focus {border-color:var(--primary);background:#ffffff;box-shadow:0 0 0 3px #315bea15;}
.bulk-app .in-muscle {font-size:14px;color:var(--muted);}
.bulk-app .in-sets {width:52px;}.bulk-app .in-reps{width:72px;}.bulk-app .in-rir{width:58px;}
.bulk-app .log-fields {margin:16px 0 0;padding:16px 0 0;border-top:1px solid var(--line);gap:18px;}
.bulk-app .log-fields .field {flex:1;}
.bulk-app .log-fields input {flex:1;width:72px;background:#f5f7ff;border-color:#d8e0fa;color:#2649b6;}
.bulk-app .prev-hint {margin:12px 0 0;font-size:13px;line-height:1.6;}
.bulk-app .panel-actions {gap:10px;margin-top:18px;}
.bulk-app .btn {padding:14px 12px;min-height:48px;font-size:14px;border:1px solid var(--line);background:var(--raised);}
.bulk-app .btn-log {background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-size:16px;min-height:54px;}
.bulk-app .btn:hover,.bulk-app .gear-btn:hover,.bulk-app .cat-add-btn:hover,.bulk-app .profile-add-row button:hover,.bulk-app .btn-save-now:hover {background:#dfe5f2;}
.bulk-app .btn-log:hover {background:#234ad0;}
.bulk-app .save-hint {font-size:12px;margin:14px 0;}
.bulk-app .day-note,.bulk-app .cardio-tag,.bulk-app .rest-note {font-size:13px;line-height:1.6;}
.bulk-app .principle summary {font-size:15px;padding:20px;}
.bulk-app .principle .principle-body {font-size:14px;padding:0 20px 20px;}
.bulk-app .bar-label {font-size:14px;width:38px;}.bulk-app .bar-row{margin-bottom:14px;}.bulk-app .bar-track{height:8px;}.bulk-app .bar-val{font-size:14px;}.bulk-app .bar-legend{font-size:12px;}
.bulk-app .btn-reset,.bulk-app .rec-preset-btn {font-size:14px;min-height:44px;padding:11px 8px;}
.bulk-app .settings-card,.bulk-app .rep-summary,.bulk-app .rep-day,.bulk-app .rec-filter {padding:22px;}
.bulk-app .settings-head,.bulk-app .rep-summary h2 {font-size:14px;color:var(--muted);margin:8px 0 12px;}
.bulk-app .backup-note,.bulk-app .rec-empty,.bulk-app .cat-empty,.bulk-app .empty-note {font-size:14px;}
.bulk-app .rec-group {margin-bottom:12px;}.bulk-app .rec-group summary {padding:20px;}.bulk-app .rec-title {font-size:17px;}.bulk-app .rec-count {font-size:12px;}.bulk-app .rec-body {padding:0 20px 20px;}
.bulk-app .cat-name,.bulk-app .profile-select,.bulk-app .rec-ex-name {font-size:16px;}.bulk-app .cat-item {padding:16px 0;}.bulk-app .cat-item-specs {gap:10px;}.bulk-app .cat-add-specs {flex-wrap:wrap;}.bulk-app .cat-add-btn {min-height:44px;font-size:14px;}
.bulk-app .rep-day-title,.bulk-app .rep-ex-list li {font-size:15px;}.bulk-app .rep-ex-spec,.bulk-app .rep-note,.bulk-app .rec-when,.bulk-app .rec-set {font-size:12px;}.bulk-app .rep-day-letter {color:var(--primary);font-size:20px;}
.bulk-app .rec-filter-row input[type=date] {font-size:14px;}.bulk-app .backup-textarea {font-size:13px;}
.tab-bar {max-width:712px;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));border:1px solid #dce2ed;background:#ffffffef;border-radius:24px;padding:7px;box-shadow:0 14px 40px #2838571a;backdrop-filter:blur(24px);}
.mode-btn {font-size:12px;padding:11px 5px;gap:6px;min-height:62px;border-radius:17px;color:#69758a;}
.mode-btn svg {width:22px;height:22px;}.mode-btn[aria-selected=true] {background:#e7ecff;color:#315bea;}
button {touch-action:manipulation;transition:background .18s ease,transform .18s ease!important;}button:active {transform:scale(.98);} .tab-bar :focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
[hidden] {display:none!important;}
@media(min-width:1000px){.bulk-app{max-width:1024px;padding-top:48px;}.bulk-app .exercise-list{grid-template-columns:repeat(2,minmax(0,1fr));}.bulk-app .day-tabs{max-width:580px;}.bulk-app .masthead h1{font-size:36px;}.bulk-app .stamp-row{padding:26px 28px;}.bulk-app .panel-actions{max-width:560px;margin:22px auto 0;}}
@media(max-width:480px){.bulk-app{padding:24px 16px calc(120px + env(safe-area-inset-bottom));}.bulk-app .masthead h1{font-size:27px;}.bulk-app .day-tabs{gap:6px;}.bulk-app .day-tab{padding:14px 0;}.bulk-app .stamp-row{padding:20px;}.bulk-app .in-stamp{font-size:21px;}.bulk-app .ex-row,.bulk-app .ex-row:last-child{padding:17px 14px!important;}.bulk-app .ex-fields{gap:9px 10px;}.bulk-app .ex-fields .field{flex-direction:column;align-items:flex-start;gap:5px;}.bulk-app .ex-fields>.in-muscle{align-self:flex-end;}.bulk-app .log-fields{gap:12px;}.bulk-app .settings-card,.bulk-app .rec-filter{padding:17px;}}
@media(prefers-reduced-motion:reduce){button{transition:none!important;}}

/* Light palette refinements — layout intentionally unchanged */
.bulk-app .set-total{color:#fff}.bulk-app .set-total span{color:#e4e9ff}.bulk-app .stamp-row .in-stamp{color:#fff}
.bulk-app .btn-log:hover{color:#fff}.bulk-app .gear-btn,.bulk-app .back-btn-inline{box-shadow:0 8px 28px #2334510a}
.bulk-app .ex-row,.bulk-app .day-panel,.bulk-app .settings-card,.bulk-app .rec-filter,.bulk-app .rep-summary,.bulk-app .rep-day,#principles,.bulk-app .rec-group{box-shadow:0 5px 20px #1e345208}
.bulk-app .rec-filter-row input[type=date]{color-scheme:light}
.bulk-app .profile-select .current-tag{color:#fff;background:#137454}

/* Per-exercise record action */
.bulk-app .log-fields {flex-wrap:nowrap;gap:10px;}
.bulk-app .log-fields .field {min-width:0;gap:5px;}
.bulk-app .log-fields input {min-width:0;width:52px;}
.bulk-app .btn-record-one {flex:0 0 auto;min-height:42px;padding:9px 12px;border:0;border-radius:10px;background:var(--primary);color:var(--on-primary);font:600 14px var(--ui);cursor:pointer;white-space:nowrap;}
.bulk-app .btn-record-one:hover {background:#234ad0;}
@media(max-width:360px){.bulk-app .log-fields{gap:6px}.bulk-app .btn-record-one{padding:9px 8px}}

/* Hold the left edge to reorder */
.bulk-app .ex-row{position:relative;}
.bulk-app .ex-row,.bulk-app .ex-row:last-child{padding-left:36px!important;}
.bulk-app .reorder-handle{position:absolute;left:0;top:0;bottom:0;width:30px;border:0;border-radius:17px 0 0 17px;background:transparent;color:var(--faint);font:22px var(--ui);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.bulk-app .reorder-handle:hover{background:#edf1ff;color:var(--primary);}
.bulk-app .reorder-handle.holding{background:#e7ecff;color:var(--primary);}
.bulk-app .reorder-active{outline:2px solid var(--primary);box-shadow:0 12px 28px #315bea28;z-index:2;}
.bulk-app .reorder-active .reorder-handle{cursor:grabbing;background:var(--primary);color:#fff;}
.bulk-app .pending-save{background:var(--primary);color:#fff;border-color:var(--primary);}
</style>

<body>

<div class="bulk-app" id="bulkApp">
  <div class="masthead">
    <div>
      <h1>운동 루틴<span class="profile-tag" id="profileTag"></span></h1>
      <p id="mastheadSub"></p>
    </div>
    <div class="masthead-actions">
      <button class="back-btn-inline" id="btnSettingsBack" type="button" hidden>닫기</button>
      <button class="gear-btn" id="btnSettings" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"></path>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="settings-view" id="settingsView" hidden>
    <div class="settings-head">프로필</div>
    <div class="settings-card">
      <div id="profileList"></div>
      <div class="profile-add-row">
        <input type="text" id="newProfileName" placeholder="새 프로필 이름" aria-label="새 프로필 이름">
        <button id="btnAddProfile" type="button">추가</button>
      </div>

      <div class="backup-actions">

      </div>

        <textarea id="backupText" class="backup-textarea" readonly rows="6"></textarea>
        <button class="btn-reset" id="btnBackupCopy" type="button">복사</button>

      <div id="recordsList"></div>

    <div id="reportView" hidden></div>

<script>
(function () {
  var MUSCLES = ['가슴', '등', '어깨', '하체', '삼두', '이두'];
  var MUSCLE_COLOR = {
    '가슴': 'var(--m-chest)',
    '등': 'var(--m-back)',
    '어깨': 'var(--m-shoulder)',
    '하체': 'var(--m-legs)',
    '삼두': 'var(--m-tri)',

  function parseRepRange(r) {
    var m = String(r).match(/(\d+)\s*~\s*(\d+)/);

    var n = parseInt(r, 10);

  function suggestNext(ex, name) {
    var h = historyFor(name);
    if (h.length === 0) return null;
    var last = h[h.length - 1];
    var range = parseRepRange(ex.r);
    if (!range) return null;
    var doneReps = parseInt(last.reps, 10);
    var lastW = parseFloat(last.w);
    if (isNaN(doneReps) || isNaN(lastW)) return null;
    var isCompound = range.hi <= 10;
    var bump = isCompound ? 2.5 : 1;

    if (doneReps >= range.hi) {
      return { text: '반복수 상한(' + range.hi + '회) 도달 · RIR도 목표대로였다면 다음엔 ' + (lastW + bump) + 'kg 시도', type: 'up' };
    }

    if (doneReps < range.lo) {
      var misses = 0;
      for (var i = h.length - 1; i >= 0; i--) {
        var w = parseFloat(h[i].w);
        var reps = parseInt(h[i].reps, 10);
        if (isNaN(w) || w !== lastW) break;
        if (isNaN(reps) || reps >= range.lo) break;
        misses++;

      if (misses >= 2) {
        return { text: '반복수 하한(' + range.lo + '회) ' + misses + '회 연속 미달 · 무게를 ' + (lastW - bump) + 'kg로 낮춰보세요', type: 'down' };
      }

    }

    if (type === 'number') { el.min = '1'; el.max = '20'; el.step = '1'; el.inputMode = 'numeric'; }
    el.value = value;
    el.addEventListener('input', function () { onChange(el.value); });
    return el;
  }

  function makeNumberInput(cls, value, min, max, step, onChange, emptyFallback) {
    var el = document.createElement('input');
    el.className = cls;
    el.type = 'number';
    el.min = String(min);
    el.max = String(max);
    el.step = String(step);
    el.inputMode = step < 1 ? 'decimal' : 'numeric';
    el.value = value;
    el.addEventListener('input', function () { onChange(el.value, false); });
    el.addEventListener('blur', function () {
      if (el.value.trim() === '') {
        if (emptyFallback != null) { el.value = emptyFallback; onChange(String(emptyFallback), true); }
        else { onChange('', true); }
        return;
      }
      var clamped = clampNumber(el.value, min, max, emptyFallback != null ? emptyFallback : null);
      if (clamped === null) { el.value = ''; onChange('', true); return; }
      el.value = clamped;
      onChange(String(clamped), true);
    });
    return el;
  }

  function wrapField(labelText, input) {
    var wrap = document.createElement('span');
    wrap.className = 'field';
    var lab = document.createElement('label');
    lab.textContent = labelText;
    wrap.appendChild(input);
    wrap.appendChild(lab);
    return wrap;
  }

  function attachReorderHandle(row, list, day) {
    var handle = document.createElement('button');
    handle.type = 'button';
    handle.className = 'reorder-handle';
    handle.textContent = '⠿';
    handle.title = '1.2초 길게 누른 뒤 위아래로 이동 · 키보드 Alt+↑/↓';
    handle.setAttribute('aria-label', '운동 순서 이동: 길게 누르고 드래그 또는 Alt와 방향키');
    row.appendChild(handle);
    var timer = null, active = false, pointer = null, startX = 0, startY = 0;
    var lastX = 0, lastY = 0, frame = 0;
    function moveAt(x, y) {
      var candidates = Array.from(list.children).filter(function (el) { return el !== row; });
      var closest = null, distance = Infinity;
      candidates.forEach(function (el) {
        var box = el.getBoundingClientRect();
        var dx = x < box.left ? box.left-x : (x > box.right ? x-box.right : 0);
        var dy = y-(box.top+box.height/2);
        var score = dx*dx + dy*dy;
        if (score < distance) { closest=el; distance=score; }
      });
      if (!closest) return;
      var rect = closest.getBoundingClientRect();
      if (y < rect.top + rect.height/2) list.insertBefore(row, closest);
      else list.insertBefore(row, closest.nextSibling);
    }
    function scrollFrame() {
      if (!active) return;
      var speed = lastY < 100 ? -12 : (lastY > window.innerHeight-110 ? 12 : 0);
      if (speed) { window.scrollBy(0,speed); moveAt(lastX,lastY); }
      frame = requestAnimationFrame(scrollFrame);
    }
    function finish(cancelled) {
      clearTimeout(timer); timer=null;
      var wasActive=active; active=false;
      cancelAnimationFrame(frame);
      row.classList.remove('reorder-active');handle.classList.remove('holding');
      handle.setAttribute('aria-pressed','false');
      if (pointer !== null && handle.hasPointerCapture(pointer)) handle.releasePointerCapture(pointer);
      pointer=null;
      if (!wasActive) return;
      var reordered=Array.from(list.children).map(function(el){return el._exercise;});
      if (!cancelled && reordered.some(function(ex,i){return ex !== day.ex[i];})) {
        day.ex=reordered;
        routineOrderPending=true;
      }
      renderPanel();
      if (routineOrderPending) showPendingOrder();
    }
    handle.addEventListener('pointerdown',function(e){
      if (e.button !== 0 || pointer !== null) return;
      pointer=e.pointerId;startX=lastX=e.clientX;startY=lastY=e.clientY;
      handle.setPointerCapture(pointer);handle.classList.add('holding');
      timer=setTimeout(function(){
        active=true;row.classList.add('reorder-active');handle.classList.remove('holding');
        handle.setAttribute('aria-pressed','true');
        frame=requestAnimationFrame(scrollFrame);
      },1200);
    });
    handle.addEventListener('pointermove',function(e){
      if(e.pointerId !== pointer)return;
      lastX=e.clientX;lastY=e.clientY;
      if(!active){if(Math.hypot(lastX-startX,lastY-startY)>12) finish(true);return;}
      e.preventDefault();moveAt(lastX,lastY);
    });
    handle.addEventListener('pointerup',function(e){if(e.pointerId===pointer)finish(false);});
    handle.addEventListener('pointercancel',function(e){if(e.pointerId===pointer)finish(true);});
    handle.addEventListener('lostpointercapture',function(){if(pointer!==null)finish(true);});
    handle.addEventListener('contextmenu',function(e){e.preventDefault();});
    handle.addEventListener('keydown',function(e){
      if(e.key==='Escape'){finish(true);return;}
      if(!e.altKey || (e.key!=='ArrowUp' && e.key!=='ArrowDown'))return;
      e.preventDefault();var i=day.ex.indexOf(row._exercise),j=i+(e.key==='ArrowUp'?-1:1);
      if(j<0 || j>=day.ex.length)return;
      var item=day.ex.splice(i,1)[0];day.ex.splice(j,0,item);
      routineOrderPending=true;renderPanel();showPendingOrder();
      panelEl.querySelectorAll('.reorder-handle')[j].focus();
    });
  }

    function saveExerciseRecords(selectedIndex) {
      var entries = [];
      var rows = panelEl.querySelectorAll('.ex-row');

      // 모바일 브라우저에서 마지막 입력 이벤트가 늦게 반영되는 경우까지 대비해
      // 버튼을 누르는 순간 화면에 보이는 값을 직접 다시 읽는다.
      d.ex.forEach(function (ex, idx) {
        if (selectedIndex !== null && idx !== selectedIndex) return;
        var dr = getDraft(d.key, ex.n);
        var row = rows[idx];
        if (row) {
          var wEl = row.querySelector('.in-weight');
          var repsEl = row.querySelector('.in-done');
          if (wEl) dr.w = String(wEl.value || '').trim();
          if (repsEl) dr.reps = String(repsEl.value || '').trim();
        }

        var weight = String(dr.w == null ? '' : dr.w).trim();
        var doneReps = String(dr.reps == null ? '' : dr.reps).trim();
        if (weight !== '' || doneReps !== '') {
          entries.push({
            id: genId(),
            n: ex.n,
            m: ex.m,
            w: weight || '-',
            reps: doneReps || '-'
          });
        }
      });

      var hint = document.getElementById('saveHint');
      if (entries.length === 0) {
        hint.textContent = '저장할 기록이 없어요 · kg 또는 실제 횟수를 입력해주세요';
        hint.className = 'save-hint';
        return;
      }

      // 저장에 실패했을 때 현재 화면의 입력값이 사라지지 않도록 초안을 먼저 보존한다.
      writeJSON(DRAFT_KEY, draft);

      var date = todayStr();
      var nextLogs = logs.map(function (rec) {
        return {
          date: rec.date,
          dayKey: rec.dayKey,
          entries: (rec.entries || []).slice()
        };
      });
      var existing = -1;
      for (var i = 0; i < nextLogs.length; i++) {
        if (nextLogs[i].date === date && nextLogs[i].dayKey === d.key) { existing = i; break; }
      }
      if (existing >= 0) nextLogs[existing].entries = (nextLogs[existing].entries || []).concat(entries);
      else nextLogs.push({ date: date, dayKey: d.key, entries: entries });
      nextLogs.sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });

      var ok = writeJSON(LOG_KEY, nextLogs);
      var persisted = ok ? readJSON(LOG_KEY, null) : null;
      if (!ok || !Array.isArray(persisted)) {
        hint.textContent = '기록을 저장하지 못했어요 · 브라우저 저장 권한을 확인해주세요';
        hint.className = 'save-hint save-error';
        return;

      // 실제 저장이 확인된 뒤에만 메모리 상태와 입력 초안을 갱신한다.
      logs = persisted;
      if (selectedIndex === null) draft[d.key] = {};

  function weeklyVolume() {
    var out = {};
    MUSCLES.forEach(function (m) { out[m] = 0; });
    days.forEach(function (d) {
      d.ex.forEach(function (e) {
        var s = parseInt(e.s, 10) || 0;
        if (out[e.m] !== undefined) out[e.m] += s;
      });
    });
    return out;
  }

  function numberedHistory(h) {
    var blocks = [];
    h.forEach(function (r) {
      var last = blocks[blocks.length - 1];
      if (last && last.date === r.date) last.items.push(r);
      else blocks.push({ date: r.date, items: [r] });
    });
    var out = [];
    var prevWeight = null;
    blocks.forEach(function (block) {
      block.items.forEach(function (r, idx) {
        var w = parseFloat(r.w);
        var trend = null;
        if (prevWeight !== null && !isNaN(w)) {
          if (w > prevWeight) trend = 'up';
          else if (w < prevWeight) trend = 'down';
        }
        out.push({ date: r.date, w: r.w, reps: r.reps, id: r.id, setNum: idx + 1, trend: trend });
        if (!isNaN(w)) prevWeight = w;
      });
    });
    return out;
  }

  function volumeBarsHtml(vol) {
    return MUSCLES.map(function (m) {
      var v = vol[m];
      var pct = Math.min(100, (v / MRV) * 100);
      var mevPct = (MEV / MRV) * 100;
      var cls = v < MEV ? 'under' : (v > MRV ? 'over' : '');
      var fillStyle = 'width:' + pct + '%' + (cls ? '' : ';background:' + MUSCLE_COLOR[m]);
      return '<div class="bar-row">' +
        '<span class="bar-label" style="color:' + MUSCLE_COLOR[m] + '">' + m + '</span>' +
        '<span class="bar-track">' +
        '<span class="bar-fill ' + cls + '" style="' + fillStyle + '"></span>' +
        '<span class="bar-mark" style="left:' + mevPct + '%"></span>' +
        '</span>' +
        '<span class="bar-val">' + v + '</span>' +
        '</div>';
    }).join('');
  }

        '<div class="principle-body">' +
          '<p><b>컴파운드</b> (벤치프레스, 스쿼트, 로우 등) — 6~10회, RIR 1~2. 관절 부담과 CNS 피로를 고려해 여유를 남겨요.</p>' +
          '<p><b>고립 · 머신</b> (케이블 플라이, 레터럴 레이즈, 레그컬 등) — 10~15(~20)회, RIR 0~1. 전신 피로가 적어 실패 근접까지 밀어붙여도 괜찮아요.</p>' +
        '</div>' +
      '</details>' +
      '<details class="principle"' + (openStates[3] ? ' open' : '') + '>' +
        '<summary>더블 프로그레션 — 무게 올리는 법<span class="chev"></span></summary>' +
        '<div class="principle-body">' +
          '<p>각 종목의 반복수는 고정값이 아니라 <b>범위</b>예요 (예: 8~10회). 이 범위 안에서 순서대로 진행해요.</p>' +
          '<ol>' +
            '<li>정해진 무게로 <b>모든 세트가 범위 상한</b>에 도달하고, 목표 RIR도 만족하면 → 다음 세션에 무게를 올려요.</li>' +
            '<li>무게를 올리면 반복수는 다시 범위 하한 근처로 떨어지는 게 정상이에요. 거기서부터 다시 상한까지 채워나가는 걸 반복해요.</li>' +
            '<li>상한을 못 채우면 무게는 그대로 두고 같은 무게로 다음 세션에 재도전하세요.</li>' +
          '</ol>' +
          '<p><b>증량 신호는 두 조건을 동시에 만족할 때만</b> — 반복수를 채웠어도 RIR이 목표보다 힘들게 느껴졌다면 증량하지 마세요.</p>' +
          '<p><b>증량 폭</b>: 컴파운드는 2.5~5kg, 고립·머신은 스택 한 칸 정도의 작은 폭으로.</p>' +
        '</div>' +
      '</details>';
  }

  var recPendingDel = null;
  var recFilterFrom = '';
  var recFilterTo = '';
  function renderRecords() {
    var openStates = {};
    document.querySelectorAll('#recordsView .rec-group').forEach(function (el, i) { openStates[i] = el.open; });
    var filterActive = !!(recFilterFrom || recFilterTo);

    var html = '';
    MUSCLES.forEach(function (m, mi) {
      var entries = (catalog[m] || []).slice();
      var knownNames = entries.map(function (c) { return c.n; });

      // 새 기록에는 부위(m)를 함께 저장한다. 종목 관리 목록에서 나중에 삭제해도
      // 기록 탭에서 해당 운동 기록 자체는 계속 확인할 수 있게 한다.
      logs.forEach(function (rec) {
        (rec.entries || []).forEach(function (e) {
          if (e.m === m && knownNames.indexOf(e.n) === -1) {
            knownNames.push(e.n);
            entries.push({ n: e.n });
          }
        });
      });

      var exHtml = '';
      var trackedCount = 0;
      entries.forEach(function (c) {
        var name = c.n;
        var h = historyFor(name).filter(function (r) {
          if (recFilterFrom && r.date < recFilterFrom) return false;
          if (recFilterTo && r.date > recFilterTo) return false;
          return true;
        });
        if (h.length === 0) return;
        trackedCount += 1;
        var recent = numberedHistory(h).slice(-6);
        var rows = recent.map(function (r) {
          var confirming = recPendingDel === r.id;
          var mark = r.trend === 'up' ? ' <span class="up">↑</span>' : (r.trend === 'down' ? ' <span class="down">↓</span>' : '');
          return '<div class="rec-item">' +
            '<span class="rec-when">' + r.date.slice(5) + '</span>' +
            '<span class="rec-set">' + r.setNum + '세트</span>' +
            '<span class="rec-val">' + r.w + '<span class="unit">kg×' + r.reps + '회</span>' + mark + '</span>' +
            '<button class="btn-hist-del' + (confirming ? ' confirming' : '') + '" type="button" data-id="' + r.id +
              '" aria-label="이 기록 삭제">' + (confirming ? '삭제?' : '×') + '</button>' +
          '</div>';
        }).join('');
        exHtml += '<div class="rec-ex"><div class="rec-ex-name">' + name + '</div>' + rows + '</div>';
      });
      var hasAny = trackedCount > 0;
      var isOpen = openStates[mi] === true;
      var emptyMsg = filterActive ? '선택한 기간에는 기록이 없어요.' : '아직 저장된 기록이 없어요.';
      html += '<details class="rec-group" style="border-left:3px solid ' + MUSCLE_COLOR[m] + '"' + (isOpen ? ' open' : '') + '>' +
        '<summary>' +
          '<span class="rec-head"><span class="rec-title" style="color:' + MUSCLE_COLOR[m] + '">' + m + '</span>' +
          '<span class="rec-count">' + (hasAny ? trackedCount + '개 종목' : '기록 없음') + '</span></span>' +
          '<span class="rec-chev"></span>' +
        '</summary>' +
        '<div class="rec-body">' + (hasAny ? exHtml : '<p class="rec-empty">' + emptyMsg + '</p>') + '</div>' +
      '</details>';
    });
    recordsListEl.innerHTML = html;

    recordsListEl.querySelectorAll('.btn-hist-del').forEach(function (b) {
      var id = b.getAttribute('data-id');
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (recPendingDel !== id) { recPendingDel = id; renderRecords(); return; }
        recPendingDel = null;
        for (var i = logs.length - 1; i >= 0; i--) {
          var entries = logs[i].entries || [];
          var idx = -1;
          for (var j = 0; j < entries.length; j++) { if (entries[j].id === id) { idx = j; break; } }
          if (idx !== -1) {
            entries.splice(idx, 1);
            if (entries.length === 0) logs.splice(i, 1);
            break;
          }
        }
        writeJSON(LOG_KEY, logs);
        renderRecords();
      });
    });
  }

  var catPendingDel = null;
  function renderCatalog() {
    var openStates = {};
    document.querySelectorAll('#catalogView .rec-group').forEach(function (el, i) { openStates[i] = el.open; });

    var html = '';
    MUSCLES.forEach(function (m, mi) {
      var arr = catalog[m];
      var itemsHtml = arr.length ? arr.map(function (c, ci) {
        var token = m + '|' + c.n;
        var confirming = catPendingDel === token;
        return '<div class="cat-item">' +
          '<div class="cat-item-top">' +
            '<span class="cat-name">' + c.n + '</span>' +
            '<button class="btn-hist-del' + (confirming ? ' confirming' : '') + '" type="button" data-muscle="' + m +
              '" data-name="' + String(c.n).replace(/"/g, '&quot;') + '" aria-label="삭제">' + (confirming ? '삭제?' : '×') + '</button>' +
          '</div>' +
          '<div class="cat-item-specs">' +
            '<span class="field"><input type="number" class="in-sets cat-edit" data-muscle="' + m + '" data-idx="' + ci +
              '" data-field="s" min="1" max="20" step="1" value="' + c.s + '"><label>세트</label></span>' +
            '<span class="field"><input type="text" class="in-reps cat-edit" data-muscle="' + m + '" data-idx="' + ci +
              '" data-field="r" value="' + String(c.r).replace(/"/g, '&quot;') + '"><label>회</label></span>' +
            '<span class="field"><input type="text" class="in-rir cat-edit" data-muscle="' + m + '" data-idx="' + ci +
              '" data-field="rir" value="' + String(c.rir).replace(/"/g, '&quot;') + '"><label>RIR</label></span>' +
          '</div>' +
        '</div>';
      }).join('') : '<p class="cat-empty">등록된 종목이 없어요.</p>';

      var isOpen = openStates[mi] === true;
      html += '<details class="rec-group" style="border-left:3px solid ' + MUSCLE_COLOR[m] + '"' + (isOpen ? ' open' : '') + '>' +
        '<summary>' +
          '<span class="rec-head"><span class="rec-title" style="color:' + MUSCLE_COLOR[m] + '">' + m + '</span>' +
          '<span class="rec-count">' + arr.length + '개</span></span>' +
          '<span class="rec-chev"></span>' +
        '</summary>' +
        '<div class="rec-body">' +
          itemsHtml +
          '<div class="cat-add-row">' +
            '<input type="text" class="cat-add-name" data-muscle="' + m + '" placeholder="새 종목 이름" aria-label="' + m + ' 새 종목 이름">' +
            '<div class="cat-add-specs">' +
              '<input type="number" class="in-sets cat-add-sets" min="1" max="20" step="1" data-muscle="' + m + '" placeholder="세트" aria-label="세트">' +
              '<input type="text" class="in-reps cat-add-reps" data-muscle="' + m + '" placeholder="회" aria-label="반복수">' +
              '<input type="text" class="in-rir cat-add-rir" data-muscle="' + m + '" placeholder="RIR" aria-label="RIR">' +
              '<button class="cat-add-btn" type="button" data-muscle="' + m + '">추가</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</details>';
    });
    catalogListEl.innerHTML = html;

    catalogListEl.querySelectorAll('.cat-edit').forEach(function (input) {
      input.addEventListener('input', function () {
        var m = input.getAttribute('data-muscle');
        var idx = parseInt(input.getAttribute('data-idx'), 10);
        var field = input.getAttribute('data-field');
        var entry = catalog[m] && catalog[m][idx];
        if (!entry) return;
        entry[field] = field === 's' ? (parseInt(input.value, 10) || 0) : input.value;
        writeJSON(CATALOG_KEY, catalog);
      });
      if (input.getAttribute('data-field') === 's') {
        input.addEventListener('blur', function () {
          var m = input.getAttribute('data-muscle');
          var idx = parseInt(input.getAttribute('data-idx'), 10);
          var entry = catalog[m] && catalog[m][idx];
          if (!entry) return;
          var clamped = clampNumber(input.value, 1, 20, 3);
          input.value = clamped;
          entry.s = clamped;
          writeJSON(CATALOG_KEY, catalog);
        });
      }
    });

    catalogListEl.querySelectorAll('.cat-add-btn').forEach(function (btn) {
      var m = btn.getAttribute('data-muscle');
      var nameInput = catalogListEl.querySelector('.cat-add-name[data-muscle="' + m + '"]');
      var setsInput = catalogListEl.querySelector('.cat-add-sets[data-muscle="' + m + '"]');
      var repsInput = catalogListEl.querySelector('.cat-add-reps[data-muscle="' + m + '"]');
      var rirInput = catalogListEl.querySelector('.cat-add-rir[data-muscle="' + m + '"]');
      function doAdd() {
        var v = nameInput.value.trim();
        if (!v) return;
        if (catalog[m].some(function (c) { return c.n === v; })) { nameInput.value = ''; return; }
        var s = clampNumber(setsInput.value, 1, 20, 3);
        var r = repsInput.value.trim() || '8~12';
        var rir = rirInput.value.trim() || '1~2';
        catalog[m].push({ n: v, s: s, r: r, rir: rir });
        writeJSON(CATALOG_KEY, catalog);
        renderCatalog();
      }
      btn.addEventListener('click', function (ev) { ev.preventDefault(); doAdd(); });
      [nameInput, setsInput, repsInput, rirInput].forEach(function (el) {
        el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); doAdd(); } });
      });
    });

    catalogListEl.querySelectorAll('.btn-hist-del').forEach(function (b) {
      var m = b.getAttribute('data-muscle');
      var name = b.getAttribute('data-name');
      var token = m + '|' + name;
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        if (catPendingDel !== token) { catPendingDel = token; renderCatalog(); return; }
        catPendingDel = null;
        var idx = catalog[m].findIndex(function (c) { return c.n === name; });
        if (idx !== -1) catalog[m].splice(idx, 1);
        writeJSON(CATALOG_KEY, catalog);
        renderCatalog();
      });
    });
  }

  function renderReport() {
    var vol = weeklyVolume();
    var barsHtml = volumeBarsHtml(vol);

    var daysHtml = days.map(function (d) {
      var exHtml = d.ex.length
        ? '<ul class="rep-ex-list">' + d.ex.map(function (e) {
            return '<li><span class="rep-ex-name">' + e.n + '</span>' +
              '<span class="rep-ex-spec"><b>' + e.s + '</b>세트 · ' + e.r + '회 · RIR ' + e.rir + '</span></li>';
          }).join('') + '</ul>'
        : '<p class="empty-note">종목이 없어요.</p>';
      var noteHtml = d.note ? '<p class="rep-note">' + d.note + '</p>' : '';
      var cardioHtml = d.cardio ? '<div class="cardio-tag">+ 웨이트 후 저강도 유산소 15~20분</div>' : '';
      return '<div class="rep-day">' +
        '<div class="rep-day-head">' +
          '<span class="rep-day-letter">' + d.letter + '</span>' +
          '<span class="rep-day-title">' + d.title + '</span>' +
          '<span class="rep-day-total">' + dayTotal(d) + '<span>세트</span></span>' +
        '</div>' +
        exHtml + noteHtml + cardioHtml +
      '</div>';
    }).join('');

    reportViewEl.innerHTML =
      '<div class="rep-summary">' +
        '<h2>주간 부위별 볼륨</h2>' +
        '<div class="bars">' + barsHtml + '</div>' +
        '<p class="bar-legend">막대는 MRV(22) 기준 · 빨간 선은 MEV(14) 지점 · 회색은 부족, 빨강은 초과</p>' +
      '</div>' +
      daysHtml;
  }

  document.getElementById('btnSaveNow').addEventListener('click', function () {
    save(true);
  });

  document.getElementById('btnCatalogSave').addEventListener('click', function () {
    var ok = writeJSON(CATALOG_KEY, catalog);
    var hint = document.getElementById('catalogSaveHint');
    hint.textContent = ok ? '저장됨' : '저장 실패 (브라우저 저장 불가)';
    hint.className = ok ? 'save-hint on' : 'save-hint';
    clearTimeout(hint._t);
    hint._t = setTimeout(function () { hint.textContent = ''; hint.className = 'save-hint'; }, 1400);
  });

  document.getElementById('btnCatalogReset').addEventListener('click', function () {
    catalog = defaultCatalog();
    writeJSON(CATALOG_KEY, catalog);
    renderCatalog();
  });

  (function () {
    var fromInput = document.getElementById('recFilterFrom');
    var toInput = document.getElementById('recFilterTo');
    fromInput.addEventListener('change', function () { recFilterFrom = fromInput.value; renderRecords(); });
    toInput.addEventListener('change', function () { recFilterTo = toInput.value; renderRecords(); });
    document.querySelectorAll('.rec-preset-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = btn.getAttribute('data-preset');
        if (p === 'all') { recFilterFrom = ''; recFilterTo = ''; }
        else if (p === 'week') { recFilterFrom = daysAgoStr(6); recFilterTo = todayStr(); }
        else if (p === 'month') { recFilterFrom = daysAgoStr(29); recFilterTo = todayStr(); }
        fromInput.value = recFilterFrom;
        toInput.value = recFilterTo;
        renderRecords();
      });
    });
  })();

  (function () {
    var armed = false;
    var timer = null;
    var btn = document.getElementById('btnRecordsDeleteAll');
    function reset() {
      armed = false;
      btn.textContent = '전체 삭제';
      btn.style.color = '';
      btn.style.borderColor = '';
    }
    btn.addEventListener('click', function () {
      if (!armed) {
        armed = true;
        btn.textContent = '한 번 더 누르면 전체 삭제돼요';
        btn.style.color = '#c1432a';
        btn.style.borderColor = '#c1432a';
        clearTimeout(timer);
        timer = setTimeout(reset, 4000);
        return;
      }
      clearTimeout(timer);
      reset();
      logs = [];
      writeJSON(LOG_KEY, logs);
      renderRecords();
    });
  })();

  document.getElementById('btnClearDay').addEventListener('click', function () {
    var d = days[activeIndex];
    d.ex = [];
    d.title = '';
    d.cardio = false;
    delete d.note;
    renderPanel();
    renderPrinciples();
  });

  var resetBtn = document.getElementById('btnReset');
  resetBtn.addEventListener('click', function () {
    days = defaults();
    save();
    renderTabs();
    renderPanel();
    renderPrinciples();
  });

  var profileTagEl = document.getElementById('profileTag');
  function updateProfileLabel() {
    profileTagEl.textContent = activeProfile;
  }

  var profileListEl = document.getElementById('profileList');
  var catDelPendingProfile = null;
  function renderProfileList() {
    profileListEl.innerHTML = profiles.map(function (name) {
      var isActive = name === activeProfile;
      var canDelete = !isActive && profiles.length > 1;
      var confirming = catDelPendingProfile === name;
      var delBtn = canDelete
        ? '<button class="btn-hist-del' + (confirming ? ' confirming' : '') + '" type="button" data-name="' +
          String(name).replace(/"/g, '&quot;') + '" aria-label="프로필 삭제">' + (confirming ? '삭제?' : '×') + '</button>'
        : '';
      return '<div class="profile-row">' +
        '<button class="profile-select" type="button" data-name="' + String(name).replace(/"/g, '&quot;') +
          '" aria-pressed="' + isActive + '">' + name +
          (isActive ? '<span class="current-tag">사용중</span>' : '') +
        '</button>' +
        delBtn +
      '</div>';
    }).join('');

    profileListEl.querySelectorAll('.profile-select').forEach(function (b) {
      b.addEventListener('click', function () {
        var name = b.getAttribute('data-name');
        if (name === activeProfile) return;
        switchProfile(name);
        renderProfileList();
      });
    });
    profileListEl.querySelectorAll('.btn-hist-del').forEach(function (b) {
      var name = b.getAttribute('data-name');
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        if (catDelPendingProfile !== name) { catDelPendingProfile = name; renderProfileList(); return; }
        catDelPendingProfile = null;
        var idx = profiles.indexOf(name);
        if (idx !== -1) profiles.splice(idx, 1);
        writeJSON(PROFILES_KEY, profiles);
        [
          keyFor('bulk-routine-v4', name),
          keyFor('bulk-routine-catalog-v2', name),
          keyFor('bulk-routine-log-v1', name),
          keyFor('bulk-routine-draft-v1', name)
        ].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
        renderProfileList();
      });
    });
  }

  function switchProfile(name) {
    activeProfile = name;
    writeJSON(ACTIVE_PROFILE_KEY, activeProfile);
    applyProfileKeys();
    days = load();
    routineOrderPending = false;
    document.getElementById('btnSaveNow').classList.remove('pending-save');
    catalog = loadCatalog();
    logs = loadLogs();
    draft = readJSON(DRAFT_KEY, {});
    recFilterFrom = '';
    recFilterTo = '';
    var fromInput = document.getElementById('recFilterFrom');
    var toInput = document.getElementById('recFilterTo');
    if (fromInput) fromInput.value = '';
    if (toInput) toInput.value = '';
    activeIndex = todayIndex !== null ? todayIndex : 0;
    updateProfileLabel();
    if (mode === 'catalog') renderCatalog();
    else if (mode === 'records') renderRecords();
    else if (mode === 'report') renderReport();
    else { renderTabs(); renderPanel(); renderPrinciples(); }
  }

    settingsViewEl.hidden = false;

  function collectAllData() {
    var data = {};
    profiles.forEach(function (p) {
      data[p] = {
        days: readJSON(keyFor('bulk-routine-v4', p), null),
        catalog: readJSON(keyFor('bulk-routine-catalog-v2', p), null),
        logs: readJSON(keyFor('bulk-routine-log-v1', p), null),
        draft: readJSON(keyFor('bulk-routine-draft-v1', p), null)
      };
    });
    return {
      version: 1,
      exportedAt: new Date().toISOString(),
      profiles: profiles,
      activeProfile: activeProfile,
      data: data
    };
  }

  document.getElementById('btnBackupDownload').addEventListener('click', function () {

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '운동루틴-백업-' + todayStr() + '.json';
    document.body.appendChild(a);

    if (!raw) {
      hint.textContent = '백업 텍스트를 먼저 붙여넣어주세요';
      hint.className = 'save-hint';
      return;
    }
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) {
      hint.textContent = '올바른 백업 텍스트가 아니에요';
      hint.className = 'save-hint';
      return;
    }
    if (!parsed || typeof parsed !== 'object' || !parsed.data || !Array.isArray(parsed.profiles) || parsed.profiles.length === 0) {
      hint.textContent = '올바른 백업 텍스트가 아니에요';
      hint.className = 'save-hint';
      return;
    }

    parsed.profiles.forEach(function (p) {
      var pd = parsed.data[p] || {};
      if (pd.days) writeJSON(keyFor('bulk-routine-v4', p), pd.days);
      if (pd.catalog) writeJSON(keyFor('bulk-routine-catalog-v2', p), pd.catalog);
      if (pd.logs) writeJSON(keyFor('bulk-routine-log-v1', p), pd.logs);
      if (pd.draft) writeJSON(keyFor('bulk-routine-draft-v1', p), pd.draft);
    });
    writeJSON(PROFILES_KEY, parsed.profiles);
    var newActive = (parsed.activeProfile && parsed.profiles.indexOf(parsed.activeProfile) !== -1)
      ? parsed.activeProfile : parsed.profiles[0];
    writeJSON(ACTIVE_PROFILE_KEY, newActive);

    profiles = parsed.profiles;
    activeProfile = newActive;
    applyProfileKeys();
    days = load();
    routineOrderPending = false;
    document.getElementById('btnSaveNow').classList.remove('pending-save');
    catalog = loadCatalog();
    logs = loadLogs();
    draft = readJSON(DRAFT_KEY, {});
    activeIndex = todayIndex !== null ? todayIndex : 0;

    updateProfileLabel();
    renderProfileList();
    renderTabs();
    renderPanel();
    renderPrinciples();

    hint.textContent = '복원 완료';
    hint.className = 'save-hint on';
    document.getElementById('restoreText').value = '';
  });

  (function () {
    var d = new Date();
    var wk = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById('mastheadSub').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + wk[d.getDay()] + ')';
  })();

  updateProfileLabel();

  renderModeToggle();
  renderTabs();
  renderPanel();
  renderPrinciples();

  if (memoryOnly) {
    var h = document.getElementById('saveHint');
    h.textContent = '이 브라우저에서는 저장이 안 돼요 (창을 닫으면 초기화)';
  }
})();
</script>

</body>
</html>
